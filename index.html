<style>
/* Layout: the printed book, one page per screen on an 11-inch iPad held sideways (1194 x 834).
   Each page keeps the book's header, woven band and line-only sections; the density moves behind the
   dropdowns in the page's toolbar. A practice bar sits at the foot of every page. */
:root{
  --bg:#f6efe0; --panel:#efe5cd; --panel2:#e6d8b6; --ink:#1c1915; --ink2:#3d362d; --mute:#6e6455; --rule:#d8cbaf;
  --rust:#a4502f; --gold:#b8892b; --wire:#b9a986; --str:#3d362d; --onacc:#fffaf0; --dark:#1c1915; --ondark:#f1e8d6;
  --p1:#2f6f73; --p2:#5e8c45; --p3:#a4502f; --p4:#8a4d8f; --p5:#2e3f66;
  --teal:#2f6f73; --sage:#5e8c45; --plum:#8a4d8f; --navy:#2e3f66;
  --ok:#4f7d3a; --warn:#b8892b; --bad:#b03a2e; --acc:var(--rust);
  --display:'Tenor Sans','Optima','Candara',serif;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --barh:66px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191613; --panel:#24201b; --panel2:#2e2822; --ink:#f1e8d6; --ink2:#d6cab2; --mute:#a1957f; --rule:#3c342b;
  --rust:#d47a55; --gold:#d6a649; --wire:#5d5244; --str:#c9bda5; --onacc:#191613; --dark:#0f0d0b; --ondark:#f1e8d6;
  --p1:#5aa7ab; --p2:#8dbb6f; --p3:#d47a55; --p4:#be82c3; --p5:#7f93cf; --teal:#5aa7ab; --sage:#8dbb6f; --plum:#be82c3; --navy:#7f93cf;
  --ok:#8dbb6f; --warn:#d6a649; --bad:#e2685a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191613; --panel:#24201b; --panel2:#2e2822; --ink:#f1e8d6; --ink2:#d6cab2; --mute:#a1957f; --rule:#3c342b;
  --rust:#d47a55; --gold:#d6a649; --wire:#5d5244; --str:#c9bda5; --onacc:#191613; --dark:#0f0d0b; --ondark:#f1e8d6;
  --p1:#5aa7ab; --p2:#8dbb6f; --p3:#d47a55; --p4:#be82c3; --p5:#7f93cf; --teal:#5aa7ab; --sage:#8dbb6f; --plum:#be82c3; --navy:#7f93cf;
  --ok:#8dbb6f; --warn:#d6a649; --bad:#e2685a; color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg text{font-family:var(--body)}
.book{min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;display:flex;flex-direction:column;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px;animation:turn .32s ease-out}
.page.back{animation:turnback .32s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes turnback{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}
/* the book header */
.hd{display:flex;align-items:flex-end;gap:10px 18px;flex-wrap:nowrap}
.hd .no{font-family:var(--display);font-size:46px;line-height:.85;color:var(--acc);letter-spacing:.06em}
.hd h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.6vw,40px);line-height:.9;letter-spacing:.1em;text-transform:uppercase;margin:0;white-space:nowrap}
.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{color:var(--ink2);font-size:15px;font-weight:500;flex:1 1 auto;min-width:0;padding-bottom:1px}
.hd .book-t{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-align:right;line-height:1.2;padding-bottom:1px}

    const upd = () => score.textContent = `Streak ${streak} · learned ${mastered()} of ${PITCHES.length} notes`; upd();
    const host = h('div', {});
    v.append(h('div', {class: 'body', style: 'grid-template-columns:minmax(0,1fr);align-items:start'},
      sec2(STAFF_MODES.find(m => m[0] === mode)[1], GAME_HINT[mode], 'var(--teal)', score, host)));

    if (mode === 'sf') {
      let target, answered;
      const qc = h('div', {}), board = h('div', {}), fb = h('div', {style: 'min-height:42px;margin-top:10px;font-weight:800'});
      host.append(h('div', {style: 'display:flex;gap:46px;flex-wrap:wrap;align-items:flex-start'},
        h('div', {style: 'display:flex;flex-direction:column;align-items:center'}, h('div', {class: 'muted', style: 'font-weight:800;margin-bottom:6px'}, 'Where does this note live? Tap the fret.'), qc),
        board), fb);
      const ask = () => { answered = false; target = pickNote(); qc.innerHTML = gStaffCard(target.step, target.show); board.replaceChildren(gNeck((s, f) => answer(s, f))); fb.textContent = ''; };
      const answer = (s, f) => { if (answered) return; answered = true; const ok = (OPEN_MIDI[s] + f) === target.midi; grade(target.midi, ok); streak = ok ? streak + 1 : 0; upd();
        board.replaceChildren(gNeck(null, {picked: s + ':' + f, correctMidi: ok ? null : target.midi}));
        fb.replaceChildren(h('span', {style: `color:var(--${ok ? 'sage' : 'rust'})`}, ok ? `Right — that’s ${target.name}.` : `Not quite — ${target.name} is the green fret.`),
          h('button', {class: 'btn', style: 'margin-left:16px', on: {click: ask}}, 'Next')); };
      ask();
    } else if (mode === 'fs') {
      let target, answered;
      const neck = h('div', {}), opts = h('div', {style: 'display:flex;gap:14px;flex-wrap:wrap;margin-top:12px'}), fb = h('div', {style: 'min-height:42px;margin-top:10px;font-weight:800'});
      host.append(h('div', {class: 'muted', style: 'font-weight:800;margin-bottom:6px'}, 'This fret is lit. Which staff shows it? Tap one.'), neck, opts, fb);
      const ask = () => { answered = false; target = pickNote(); const spot = POOL.find(n => n.midi === target.midi);
        neck.replaceChildren(gNeck(null, {litKey: spot.s + ':' + spot.f}));
        const choices = shuffle([target, ...shuffle(PITCHES.filter(p => p.step !== target.step)).slice(0, 3)]);
        opts.replaceChildren(...choices.map(c => h('button', {class: 'thumb', style: 'padding:6px', on: {click: () => answer(c)}}, h('div', {html: gStaffCard(c.step, c.show)}))));
        fb.textContent = ''; };
      const answer = c => { if (answered) return; answered = true; const ok = c.midi === target.midi; grade(target.midi, ok); streak = ok ? streak + 1 : 0; upd();
        fb.replaceChildren(h('span', {style: `color:var(--${ok ? 'sage' : 'rust'})`}, ok ? `Right — ${target.name}.` : `That one is ${c.name}. The lit fret is ${target.name}.`),
          h('button', {class: 'btn', style: 'margin-left:16px', on: {click: ask}}, 'Next')); };
      ask();
    } else {
      let P;
      const srd = h('div', {class: 'big', style: 'width:100%;max-width:1000px'}), bar = h('div', {style: 'display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap'});
      host.append(h('div', {class: 'muted', style: 'font-weight:800;margin-bottom:6px'}, 'Read it, then play along and rate yourself.'), srd, bar);
      const drawP = lit => srd.innerHTML = tabStaffSVG(P, {lay: {tab: 1, rhythm: 0, names: 0, staff: 1, bars: 1, key: 0}, lit});
      const gen = () => { const notes = []; for (let i = 0; i < 8; i++) { const p = PITCHES[Math.floor(Math.random() * PITCHES.length)];
          notes.push(Object.assign({}, p, {dur: 'q', beats: 1, bar: Math.floor(i / 4), col: i, count: String((i % 4) + 1)})); }
        P = {title: 'Sight-read', ts: [4, 4], nbars: 2, beatsPerBar: 4, keysig: [], sig: {}, notes}; drawP(-1); };
      const play = () => { const bpm = M.bpm || 80, q = 60 / bpm, ev = []; let acc = 0;
        P.notes.forEach((n, k) => { ev.push({at: acc * q, fn: t => playMidi(n.midi, t, {kind: 'note', gain: .4, dur: q * .9}), ui: () => drawP(k)}); acc += 1; });
        for (let b = 0; b < 8; b++) ev.push({at: b * q, fn: t => click(t, b % 4 === 0)});
        ev.push({at: 8 * q, ui: () => drawP(-1)}); ev.sort((a, b) => a.at - b.at); Seq.run(ev, 0, () => drawP(-1)); };
      const rate = kind => { if (kind !== 'shaky') P.notes.forEach(n => grade(n.midi, kind === 'clean')); streak = kind === 'clean' ? streak + 1 : 0; upd(); gen(); };
      bar.append(h('button', {class: 'btn', on: {click: play}}, '► Play'), h('span', {class: 'muted', style: 'margin:0 4px 0 8px'}, 'Rate:'),
        h('button', {class: 'btn', on: {click: () => rate('clean')}}, 'Clean'), h('button', {class: 'btn', on: {click: () => rate('shaky')}}, 'Shaky'),
        h('button', {class: 'btn', on: {click: () => rate('missed')}}, 'Missed'), h('button', {class: 'btn', style: 'margin-left:auto', on: {click: gen}}, 'New phrase'));
      gen();
    }
  }
}});

/* ================================================================ SKETCHPAD (the songwriting studio, at the back of the book) */
PAGES.push({id: 'sketch', no: '✎', name: 'Song Sketchpad', blurb: 'write your own · saves as you go', acc: 'var(--rust)', draw(v) {
  v.append(header('', 'Song <em>Sketchpad</em>', 'build a song from the chords of any key · it saves on this iPad as you go', 'tap a bar, then a chord · Roll for a fresh progression', 'var(--rust)'));
  const holder = h('div', {style: 'display:flex;flex-direction:column;gap:14px'}); v.append(holder);
  const real = $('#topright'); VIEWS.write(holder);
}});

PAGES.forEach(p => p.blurb = p.blurb || '');
const start = (location.hash || '').slice(1), si = PAGES.findIndex(p => p.id === start);
page(si >= 0 ? si : store.get('at', 0));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<div id="topright" hidden></div>
