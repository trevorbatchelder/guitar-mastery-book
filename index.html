  --p1:#3a6b55; --p2:#6f7a37; --p3:#9c3d26; --p4:#7a4a34; --p5:#3c4e6b;
  --teal:#3a6b55; --sage:#6f7a37; --plum:#7a4a34; --navy:#3c4e6b;
  --ok:#6f7a37; --warn:#b07e22; --bad:#a33a28; --acc:var(--rust);
  --display:'Tenor Sans','Optima','Candara',serif;

}
/* Moon — the cool near-black night palette; moonlight silver/steel-blue, blackletter title */
:root[data-theme="moon"]{
  --bg:#0a0c10; --panel:#13161c; --panel2:#1b1f27; --ink:#dfe6ee; --ink2:#aab4c0; --mute:#78828f; --rule:#262c36;
  --rust:#7fa6c9; --gold:#b9c2cf; --wire:#333a46; --str:#cdd4dd; --onacc:#0a0c10; --dark:#000; --ondark:#dfe6ee;
  --p1:#6e93a8; --p2:#7f9a86; --p3:#9a8fb0; --p4:#8a97ab; --p5:#6477a0;
  --teal:#6e93a8; --sage:#7f9a86; --plum:#9a8fb0; --navy:#6477a0;
  --ok:#7f9a86; --warn:#b9c2cf; --bad:#c76b6b; --acc:#8fb3d6;
  --title:'UnifrakturMaguntia','Cinzel',serif; color-scheme:dark;
}
:root[data-theme="moon"] .brand-t{text-transform:none!important;letter-spacing:.012em!important}

:root[data-theme="moon"] .brand-sm{font-size:24px!important}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}

button,select,a{touch-action:manipulation}
svg text{font-family:var(--body)}
.book{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;min-height:0;overflow:hidden;position:relative}   /* the frame: clips the content, never lays it out */
.page.scrollable{overflow-y:auto}

.pg{display:flex;flex-direction:column;gap:10px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:turn .3s cubic-bezier(.32,.72,0,1)}

/* the book header */
.hd{display:flex;align-items:flex-end;gap:10px 18px;flex-wrap:nowrap}

.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{color:var(--ink2);font-size:15px;font-weight:500;flex:1 1 auto;min-width:0;padding-bottom:1px}
.hd .book-t{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-align:right;line-height:1.2;padding-bottom:1px}
.band{color:var(--ink);height:20px;display:block;width:100%;flex:none}
/* the page toolbar: this is where the book's density went */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;flex:none}
.pick{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick>span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
select{border:1.5px solid var(--ink);background:var(--bg);border-radius:9px;padding:8px 34px 8px 12px;font-weight:800;font-size:16px;min-height:44px;max-width:100%;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:7px 10px;font-weight:800;font-size:15px;min-width:44px;min-height:44px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:9px;padding:8px 14px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.play::before{content:"";width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.on::before{width:10px;height:12px;border:0;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor;box-sizing:border-box}
:is(.btn,.chip,.seg button,select,.cbox,.thumb,.toc button,.arrow,.rt li,.go,.icon,.tempo2 button,.rate button,.goalchip):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* sections: line-only, coloured top rule, Tenor heading with a stepped diamond */
.body{flex:1;min-height:0;display:grid;gap:14px 22px}
.sec{border-top:2.5px solid var(--c,var(--ink));padding-top:7px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}

.gem{width:13px;height:13px;flex:none}

.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
/* diagrams */
.cgrid{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px 10px;align-items:end}

.cbox svg{width:100%;max-width:var(--cw,170px);height:auto}
.cbox.on{background:var(--panel)}
.cbox.dim{opacity:.3}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.thumb{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:4px 4px 2px;display:flex;flex-direction:column;align-items:center;min-width:0}
.thumb b{font-size:13px}
.thumb svg{width:100%;height:auto}
.thumb[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.big{display:flex;justify-content:center}.big svg{width:auto;max-width:100%;height:auto;max-height:430px}
/* tables */
table.t{width:100%;border-collapse:collapse}

/* contents */
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}

/* the practice bar, on every page */
.pbar{flex:none;z-index:10;min-height:calc(var(--barh) + env(safe-area-inset-bottom,0px));flex-wrap:wrap;row-gap:6px;padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:10px;background:var(--bg)}

.pbar .sp{flex:1}
.pbar .pg{font-family:var(--display);font-size:15px;letter-spacing:.1em;color:var(--mute);min-width:5ch;text-align:center}

.icon.tap{font-size:11px;font-weight:900;letter-spacing:.08em;border-color:var(--rule)}
.cta{display:flex;align-items:center;gap:12px;min-width:0}
.cta .go{background:var(--acc);color:var(--onacc);border:0;border-radius:999px;height:50px;padding:0 22px 0 18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:10px;flex:none}
.what{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.what>span:first-child{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:800}
.what>span:last-child{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.cta.none .what>span:last-child{color:var(--mute);font-weight:600}
.clock2{display:flex;align-items:center;gap:9px}
.clock2 .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px}
.clock2 .lbl{font-size:10px}
.station{display:flex;align-items:center;gap:8px;flex:none}
.station .dots{display:flex;gap:4px;margin-left:2px}
/* contextual "Numbers to beat" on the Practice page */
.goals-ctx{display:flex;flex-direction:column;gap:8px}
.goal-tiers{display:flex;gap:6px}
.goalchip{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;min-width:0;line-height:1.1}
.goalchip span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.goalchip b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.goalchip.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.goalchip.on span{color:var(--onacc)}
.youline{font-size:13px;font-weight:700}
.pgnum{font-family:var(--display);letter-spacing:.1em;color:var(--mute);font-size:13px;white-space:nowrap;text-transform:uppercase;max-width:20ch;overflow:hidden;text-overflow:ellipsis}
.arrow{width:46px;height:46px;border:1.5px solid var(--ink);font-size:24px;font-weight:600;flex:none;color:var(--ink)}
@media (max-width:980px){ .run{display:none} .hrow h1{white-space:normal} .pgnum{display:none} }
@media (max-width:600px){ .cta .what{display:none} .cta.none .what{display:flex} .cta .go{padding:0 16px 0 14px;font-size:15px} .tempo2 .v{min-width:40px} }
/* IX Writing: slim song-shape row under the bars, compact melody table */
.shape-row{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-top:2px}
.shape-row .label{color:var(--rust)}
.shape-row .tl{flex:1;min-width:200px}
.cells.mel-compact{border-spacing:2px;table-layout:auto}
.cells.mel-compact td,.cells.mel-compact th{padding:3px 8px 3px 0;font-size:14px}
.prog-list{display:flex;flex-direction:column}
.prog-item{all:unset;cursor:pointer;display:block;padding:6px 6px;border-bottom:1px solid var(--rule)}
.prog-item.on{background:var(--panel)}
.prog-item:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.pl-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pl-top b{font-weight:900;font-size:15px}
.pl-top span{font-size:14px;color:var(--ink2);font-weight:700}
.pl-desc{font-size:12px;color:var(--mute);line-height:1.3;margin-top:1px}
/* --- motion & press feedback: subtle, fast, purposeful (reviewed for an Apple-like feel) --- */
.btn,.chip,.seg button,.icon,.arrow,.go,.thumb,.cbox,.goalchip,.rate button,.toc button,.rt li,.prog-item,.bar,.tempo2 button{transition:transform .12s cubic-bezier(.2,0,.2,1),background-color .16s ease-out,color .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out,opacity .12s ease-out}
:is(.btn,.chip,.seg button,.icon,.arrow,.thumb,.goalchip,.rate button,.toc button,.tempo2 button):active{transform:scale(.96)}
.go:active{transform:scale(.975)}
.cbox.on{transform:scale(1.03)}
.play::before{transition:border-width .14s ease-out,width .14s ease-out,height .14s ease-out}
.arrow svg{width:22px;height:22px} .tempo2 button svg{width:20px;height:20px}
.pbar .beats i{transition:transform .09s ease-out,background-color .09s ease-out}
.pbar .beats i.on{transform:scale(1.35)} .pbar .beats i.on.one{transform:scale(1.5)}
.sgrid .st{transition:background .08s ease-out,transform .08s ease-out}
.sgrid .st.now{transform:scale(1.04)}
@keyframes gm-right{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes gm-wrong{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.gm-right{animation:gm-right .3s ease-out} .gm-wrong{animation:gm-wrong .32s cubic-bezier(.36,.07,.19,.97)}

/* Theory Lab: the facts feed and the circle-of-fifths wheel */
.facts{display:flex;flex-direction:column;gap:10px}
.fact{border-left:3px solid var(--navy);background:var(--panel);border-radius:0 10px 10px 0;padding:9px 14px}
.fact h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.fact p{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}
.term{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--rust);cursor:pointer;border-bottom:1.5px dotted currentColor;line-height:1.1}
.term:hover,.term:focus-visible{opacity:.72}
#cpop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;z-index:200;padding:22px}
.cpop-card{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:16px;max-width:430px;width:100%;padding:24px 26px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.cpop-card h3{margin:0 0 10px;font-family:var(--title);font-size:25px;letter-spacing:.02em;color:var(--rust)}
.cpop-short{margin:0 0 10px;font-size:16px;line-height:1.5}
.cpop-more{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--ink2)}
.cpop-see{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-top:1px solid var(--rule);padding-top:12px}
.cpop-see>div{display:flex;flex-wrap:wrap;gap:6px 14px}
.cpop-go{margin-top:16px}
.cpop-x{position:absolute;top:10px;right:14px;appearance:none;border:0;background:none;font-size:26px;line-height:1;color:var(--mute);cursor:pointer}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:8px}
.gloss-row{text-align:left;appearance:none;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:9px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit}
.gloss-row:hover{border-color:var(--rust)}
.gloss-row b{font-size:15px;color:var(--rust)}
.gloss-row span{font-size:12.5px;color:var(--ink2);line-height:1.35}
.btn.match{width:100%;text-align:left;min-height:46px}
.btn.match.sel{outline:2.5px solid var(--gold);outline-offset:1px}
.btn.match.matched{background:var(--sage);color:var(--onacc);border-color:var(--sage)}
.wheel{position:relative;width:300px;height:300px;margin:4px auto;max-width:100%}
.wheel .ring{position:absolute;inset:14px;border-radius:50%;border:1.5px dashed var(--rule)}

2","col":12},{"s":4,"f":1,"dur":"h","beats":2.0,"midi":60,"wmidi":72,"name":"C","letter":"C","acc":"","oct":4,"step":5,"below":0,"above":0,"show":"","bar":3,"count":"3","col":13}],"nbars":4}],"staffNotes":[{"s":0,"f":0,"midi":40,"name":"E","step":-7,"acc":"","below":3,"above":0,"show":""},{"s":0,"f":1,"midi":41,"name":"F","step":-6,"acc":"","below":3,"above":0,"show":""},{"s":0,"f":3,"midi":43,"name":"G","step":-5,"acc":"","below":2,"above":0,"show":""},{"s":1,"f":0,"midi":45,"name":"A","step":-4,"acc":"","below":2,"above":0,"show":""},{"s":1,"f":2,"midi":47,"name":"B","step":-3,"acc":"","below":1,"above":0,"show":""},{"s":1,"f":3,"midi":48,"name":"C","step":-2,"acc":"","below":1,"above":0,"show":""},{"s":2,"f":0,"midi":50,"name":"D","step":-1,"acc":"","below":0,"above":0,"show":""},{"s":2,"f":2,"midi":52,"name":"E","step":0,"acc":"","below":0,"above":0,"show":""},{"s":2,"f":3,"midi":53,"name":"F","step":1,"acc":"","below":0,"above":0,"show":""},{"s":3,"f":0,"midi":55,"name":"G","step":2,"acc":"","below":0,"above":0,"show":""},{"s":3,"f":2,"midi":57,"name":"A","step":3,"acc":"","below":0,"above":0,"show":""},{"s":3,"f":4,"midi":59,"name":"B","step":4,"acc":"","below":0,"above":0,"show":""},{"s":4,"f":0,"midi":59,"name":"B","step":4,"acc":"","below":0,"above":0,"show":""},{"s":4,"f":1,"midi":60,"name":"C","step":5,"acc":"","below":0,"above":0,"show":""},{"s":4,"f":3,"midi":62,"name":"D","step":6,"acc":"","below":0,"above":0,"show":""},{"s":5,"f":0,"midi":64,"name":"E","step":7,"acc":"","below":0,"above":0,"show":""},{"s":5,"f":1,"midi":65,"name":"F","step":8,"acc":"","below":0,"above":0,"show":""},{"s":5,"f":3,"midi":67,"name":"G","step":9,"acc":"","below":0,"above":0,"show":""}],"theory":{"facts":[{"t":"The circle of fifths","b":"Twelve keys arranged in a ring. Each step clockwise jumps up a perfect fifth and adds one sharp; each step counter-clockwise goes up a fourth and adds one flat.","tag":"cof"},{"t":"Why \"fifths\"?","b":"Stack perfect fifths — C, G, D, A, E… — and you walk through all twelve notes before landing back on C. That path, bent into a ring, is the circle.","tag":"cof"},{"t":"Neighbors are friends","b":"Keys that sit next to each other share almost all their notes, so music slips between them easily. C’s neighbors are G and F.","tag":"cof"},{"t":"I–IV–V lives on the circle","b":"For any key, the key one step clockwise is its V chord and one step counter-clockwise is its IV. Three touching keys give you the three chords most songs are built from.","tag":"cof"},{"t":"Relative minors","b":"Every major key shares its notes with a minor key a minor third below — A minor for C major, E minor for G. Same notes, different home base.","tag":"cof"},{"t":"Order of sharps","b":"Sharps are added F C G D A E B. One sharp (key of G) is F♯; two (D) is F♯ C♯; three (A) adds G♯ — always the next letter in that list.","tag":"cof"},{"t":"Order of flats","b":"Flats add in the reverse order: B E A D G C F. One flat (key of F) is B♭; two (B♭) is B♭ E♭.","tag":"cof"},{"t":"The top and bottom","b":"C major sits at the top with no sharps or flats. Directly opposite, F♯/G♭ has six of each — the furthest you can get from home.","tag":"cof"},{"t":"C major","b":"C major is home base — no sharps, no flats. Its relative minor is Am.","tag":"cof"},{"t":"G major","b":"G major has 1 sharp. Its relative minor is Em, and its V chord is D.","tag":"cof"},{"t":"D major","b":"D major has 2 sharps. Its relative minor is Bm, and its V chord is A.","tag":"cof"},{"t":"A major","b":"A major has 3 sharps. Its relative minor is F♯m, and its V chord is E.","tag":"cof"},{"t":"E major","b":"E major has 4 sharps. Its relative minor is C♯m, and its V chord is B.","tag":"cof"},{"t":"B major","b":"B major has 5 sharps. Its relative minor is G♯m, and its V chord is F♯.","tag":"cof"},{"t":"F♯ major","b":"F♯ major has 6 sharps. Its relative minor is D♯m, and its V chord is D♭.","tag":"cof"},{"t":"D♭ major","b":"D♭ major has 5 flats. Its relative minor is B♭m, and its V chord is A♭.","tag":"cof"},{"t":"A♭ major","b":"A♭ major has 4 flats. Its relative minor is Fm, and its V chord is E♭.","tag":"cof"},{"t":"E♭ major","b":"E♭ major has 3 flats. Its relative minor is Cm, and its V chord is B♭.","tag":"cof"},{"t":"B♭ major","b":"B♭ major has 2 flats. Its relative minor is Gm, and its V chord is F.","tag":"cof"},{"t":"F major","b":"F major has 1 flat. Its relative minor is Dm, and its V chord is C.","tag":"cof"},{"t":"What an interval is","b":"The distance between two notes, measured in semitones — one semitone is one fret. Name the distance and you can hear it coming.","tag":"intervals"},{"t":"Perfect fifth","b":"Seven semitones. The strongest, most open interval after the octave — the backbone of a power chord.","tag":"intervals"},{"t":"Major vs minor third","b":"A major third is four semitones (bright); a minor third is three (darker). That single semitone is the whole difference between a major and a minor chord.","tag":"intervals"},{"t":"The tritone","b":"Six semitones — exactly half the octave. It sounds unstable and \"wants\" to resolve, which is what gives a dominant 7 chord its pull home.","tag":"intervals"},{"t":"Octave","b":"Twelve semitones — the same note, higher. The two notes share a name because one vibrates exactly twice as fast as the other.","tag":"intervals"},{"t":"Consonant and dissonant","b":"Octaves, fifths and thirds sound settled (consonant); seconds, sevenths and the tritone sound tense (dissonant). Music is the push and pull between them.","tag":"intervals"},{"t":"Intervals build chords","b":"Stack a major third then a minor third from a root and you get a major chord; flip them and it’s minor. Chords are just intervals piled up.","tag":"intervals"},{"t":"Chords in a key","b":"Build a chord on each note of the major scale and you get a fixed pattern: major, minor, minor, major, major, minor, diminished — I ii iii IV V vi vii°.","tag":"key"},{"t":"I, IV and V","b":"The three major chords in a major key. Thousands of songs are just these three. In C that’s C, F and G.","tag":"key"},{"t":"The vi chord","b":"The relative minor, and the most-used minor chord in pop. I–V–vi–IV (C–G–Am–F) is the \"four-chord song\".","tag":"key"},{"t":"Roman numerals","b":"Capital numerals are major chords, lower-case are minor, and ° means diminished. They describe a progression in any key at once.","tag":"key"},{"t":"The V wants to go home","b":"The fifth chord pulls hardest back to the I. That tension-and-release, V to I, is how most phrases land.","tag":"key"},{"t":"Borrowing chords","b":"Slipping in a chord from the parallel minor (a ♭VII or iv) adds colour without leaving the key for long.","tag":"key"},{"t":"A major scale","b":"Whole, whole, half, whole, whole, whole, half. That fixed pattern of steps is what makes a scale sound \"major\" no matter which note you start on.","tag":"scales"},{"t":"What makes a key","b":"A key is a home note plus the seven notes of its scale. The key signature just records which of those notes are sharp or flat.","tag":"scales"},{"t":"Modes are one scale, seven homes","b":"Start the major scale on each of its notes and you get the seven modes — same notes, different centre. Start on the 2nd and it’s Dorian; the 6th gives the natural minor.","tag":"scales"},{"t":"Major vs minor at a glance","b":"The third degree tells you the mood: a major third (4 semitones from home) sounds bright, a minor third (3) sounds dark.","tag":"scales"},{"t":"The pentatonic","b":"Drop the two \"tense\" notes (the 4th and 7th) from the major scale and you get the five-note major pentatonic — almost impossible to play a wrong note.","tag":"scales"},{"t":"Dorian vs natural minor","b":"One note apart: Dorian has a natural 6th, natural minor has a ♭6. That single raised note is what gives Dorian its hopeful, jazzy lift.","tag":"scales"},{"t":"Capo = a movable nut","b":"A capo shortens every string by the same amount, so a shape you already know sounds in a higher key. Capo 2 with a G shape sounds in A.","tag":"capo"},{"t":"Each fret is a semitone","b":"Every fret you move the capo raises the key by one semitone. Capo 1 = up a half step, capo 2 = a whole step, and so on.","tag":"capo"},{"t":"Same shape, new voice","b":"Capoing up and using open shapes keeps that bright, ringing open-string sound in a key where the barre chords would sound heavier.","tag":"capo"},{"t":"Matching a singer","b":"If a song is too low, capo up until it sits in your voice — you keep the same chord shapes, just higher.","tag":"capo"},{"t":"Two guitars, one capo","b":"One guitar plays open chords, the other capos up and plays different shapes for the same chords — the two parts shimmer against each other.","tag":"capo"},{"t":"The 12th fret repeats","b":"At the 12th fret every string is an octave above its open note, and the whole pattern starts over. Learn the first twelve frets and you know them all.","tag":"fretboard"},{"t":"No note between B–C or E–F","b":"Those two pairs are only a semitone (one fret) apart; everywhere else there’s a sharp/flat between the letters.","tag":"fretboard"},{"t":"The open strings","b":"Low to high: E A D G B E. The outer two are both E, two octaves apart — handy for finding your bearings.","tag":"fretboard"},{"t":"Octave shapes","b":"The same note sits two strings up and two frets over (or three strings up and three frets back). Learn one octave shape and you can name any note from one you know.","tag":"fretboard"},{"t":"The dots","b":"The inlays at frets 3, 5, 7, 9 and the double dot at 12 are a map — most players navigate by them without thinking.","tag":"fretboard"}]},"concepts":[{"id":"half-step","term":"Half step","short":"The smallest move in Western music — one fret on the guitar. Also called a semitone.","more":"B to C and E to F are half steps with no note between them; everywhere else there is a sharp or flat in the gap.","see":["whole-step","fret","interval"]},{"id":"whole-step","term":"Whole step","short":"Two half steps — two frets. Also called a tone.","more":"The major scale is built mostly from whole steps, with two half steps in it.","see":["half-step","major-scale"]},{"id":"semitone","term":"Semitone","short":"Another name for a half step — one fret.","more":"","see":["half-step"]},{"id":"sharp","term":"Sharp (♯)","short":"One half step higher. F♯ is one fret above F.","more":"Keys on the right-hand side of the circle of fifths use sharps; they are added in the order F C G D A E B.","see":["flat","half-step","accidental","key-signature"]},{"id":"flat","term":"Flat (♭)","short":"One half step lower. B♭ is one fret below B.","more":"Keys on the left-hand side of the circle use flats, added in the order B E A D G C F.","see":["sharp","half-step","accidental","key-signature"]},{"id":"natural","term":"Natural","short":"A note with no sharp or flat — the plain letters A B C D E F G.","more":"","see":["sharp","flat"]},{"id":"accidental","term":"Accidental","short":"A sharp or flat that colours a note.","more":"In a key signature they apply for the whole piece; written mid-bar they last only to the end of that bar.","see":["sharp","flat","key-signature"]},{"id":"note","term":"Note","short":"A single pitch — one sound at one height.","more":"On the guitar every fret on every string is a note; the 12th fret repeats the open string an octave up.","see":["octave","fret"]},{"id":"octave","term":"Octave","short":"The same note higher or lower — twelve half steps apart.","more":"The two notes share a name because one vibrates exactly twice as fast as the other.","see":["note","interval"]},{"id":"interval","term":"Interval","short":"The distance between two notes, measured in half steps (frets).","more":"Name the distance and you can hear it coming — a fifth, a third, an octave. Chords are intervals stacked up.","see":["half-step","third","fifth","octave"]},{"id":"third","term":"Third","short":"A three- or four-fret interval that sets a chord’s mood.","more":"A major third (4 frets) sounds bright; a minor third (3 frets) sounds dark. That one fret is the whole difference between a major and a minor chord.","see":["interval","major-chord","minor-chord"]},{"id":"fifth","term":"Perfect fifth","short":"A seven-fret interval — the strongest, most open sound after the octave.","more":"The root and fifth together are a power chord.","see":["interval","triad"]},{"id":"tritone","term":"Tritone","short":"Six half steps — exactly half an octave. It sounds unstable and wants to resolve.","more":"That tension is what gives a dominant 7 chord its pull back home.","see":["interval","seventh-chord"]},{"id":"scale","term":"Scale","short":"A set of notes, in order, that a piece of music draws from — a home note plus its family.","more":"","see":["major-scale","minor-scale","pentatonic","key"]},{"id":"major-scale","term":"Major scale","short":"Seven notes in the pattern whole-whole-half-whole-whole-whole-half. The bright, do-re-mi sound.","more":"Start that pattern on any note and it sounds major; the pattern is what makes it, not the starting note.","see":["scale","whole-step","mode","key"]},{"id":"minor-scale","term":"Minor scale","short":"The darker cousin of the major scale — it has a flat 3rd, 6th and 7th.","more":"The natural minor is the same notes as a major scale started on its 6th note.","see":["scale","relative-minor","mode"]},{"id":"pentatonic","term":"Pentatonic","short":"A five-note scale — the major scale with its two tense notes (the 4th and 7th) dropped.","more":"Almost impossible to play a wrong note with; the backbone of blues and rock soloing.","see":["scale","major-scale"]},{"id":"mode","term":"Mode","short":"The major scale started on a different note — same notes, different home.","more":"Start on the 2nd note for Dorian, the 6th for natural minor. Seven starting points, seven moods.","see":["major-scale","scale"]},{"id":"key","term":"Key","short":"The home note of a piece plus the scale it lives in. The note everything leans toward.","more":"The key signature records which notes are sharp or flat so you don’t mark every one.","see":["tonic","key-signature","scale","circle-of-fifths"]},{"id":"key-signature","term":"Key signature","short":"The sharps or flats written at the front of the staff that belong to the key.","more":"C major has none; each step around the circle of fifths adds one.","see":["key","sharp","flat","circle-of-fifths"]},{"id":"tonic","term":"Tonic","short":"The home note of a key — the one that feels like rest. The I chord is built on it.","more":"","see":["key","roman-numerals"]},{"id":"root","term":"Root","short":"The note a chord is named after and built up from. The root of a C chord is C.","more":"","see":["chord","triad"]},{"id":"chord","term":"Chord","short":"Three or more notes played together.","more":"Most chords are a root with a third and a fifth stacked on top — a triad.","see":["triad","root","interval"]},{"id":"triad","term":"Triad","short":"The basic three-note chord: a root, a third, and a fifth.","more":"Major or minor depends on the third; stack one more third and you get a seventh chord.","see":["chord","third","fifth","seventh-chord"]},{"id":"major-chord","term":"Major chord","short":"A triad with a major third — the bright, happy sound.","more":"","see":["triad","third","minor-chord"]},{"id":"minor-chord","term":"Minor chord","short":"A triad with a minor third — the darker, sadder sound. One fret separates it from major.","more":"","see":["triad","third","major-chord"]},{"id":"diminished","term":"Diminished","short":"A tense triad of two stacked minor thirds — marked °. It wants to move.","more":"","see":["triad","third"]},{"id":"seventh-chord","term":"Seventh chord","short":"A triad with one more third on top, adding a 7th. Richer, and often restless.","more":"A dominant 7 (like G7) pulls hard back to the key’s home chord.","see":["triad","tritone","roman-numerals"]},{"id":"roman-numerals","term":"Roman numerals","short":"A way to name chords by their place in the key, so a progression works in any key at once.","more":"Capitals are major (I IV V), lower-case are minor (ii iii vi), ° is diminished.","see":["progression","key","tonic"]},{"id":"progression","term":"Progression","short":"A sequence of chords — the skeleton of a song.","more":"I–V–vi–IV is the famous \"four-chord song\".","see":["roman-numerals","chord"]},{"id":"circle-of-fifths","term":"Circle of fifths","short":"The twelve keys arranged in a ring; each step clockwise jumps up a fifth and adds one sharp.","more":"Neighbours share almost all their notes, so music slips easily between them. For any key its V is one step clockwise, its IV one step counter-clockwise.","see":["key","fifth","relative-minor","key-signature"]},{"id":"relative-minor","term":"Relative minor","short":"The minor key that shares a major key’s exact notes, sitting a minor third below.","more":"A minor is the relative minor of C major — same notes, different home.","see":["minor-scale","key","third"]},{"id":"fret","term":"Fret","short":"One of the metal bars on the neck; pressing behind one shortens the string and raises the pitch a half step.","more":"The dots at frets 3, 5, 7, 9 and the double dot at 12 are a map most players navigate by.","see":["half-step","capo"]},{"id":"capo","term":"Capo","short":"A clamp across all the strings that acts as a movable nut, raising every string the same amount.","more":"It lets a shape you know sound in a higher key — capo 2 with a G shape sounds in A.","see":["fret","key","half-step"]},{"id":"tab","term":"Tab","short":"Guitar shorthand: six lines for the six strings, numbers telling you which fret to press.","more":"It shows you where to put your fingers, but not how long each note lasts the way the staff does.","see":["staff","fret"]},{"id":"staff","term":"The staff","short":"The five lines sheet music is written on; a note’s height on them is its pitch.","more":"Unlike tab it shows rhythm and pitch together, and reads on any instrument.","see":["tab","note","time-signature"]},{"id":"time-signature","term":"Time signature","short":"The two stacked numbers at the start of a piece: how many beats per bar, and which note gets the beat.","more":"4/4 — four quarter-note beats a bar — is far and away the most common.","see":["staff","tempo"]},{"id":"tempo","term":"Tempo (BPM)","short":"How fast the beat goes, in beats per minute. Higher BPM is faster.","more":"Practise slow enough to play it clean, then nudge it up.","see":["time-signature"]},{"id":"power-chord","term":"Power chord","short":"Just the root and the fifth — no third, so it is neither major nor minor. The backbone of rock.","more":"Because it has no third, one shape works for a major or a minor chord; slide it anywhere.","see":["root","fifth","chord"]},{"id":"barre","term":"Barre","short":"Flattening one finger across several strings to fret them all at once — it turns an open shape into a moveable one.","more":"Press just behind the fret and let the bony edge of the finger do the work, not the pad.","see":["chord","fret","capo"]},{"id":"arpeggio","term":"Arpeggio","short":"Playing a chord one note at a time instead of all together — a \"broken\" chord.","more":"The heart of fingerstyle: the thumb keeps the bass while the fingers pick the notes above.","see":["chord","note"]},{"id":"open-string","term":"Open string","short":"A string played without pressing any fret, ringing at its natural pitch.","more":"Low to high the open strings are E A D G B E — the ringing notes in open chords.","see":["fret","note","tab"]}]};

      ui: () => { onBeat(b); cards.forEach((el, j) => el.classList.toggle('on', j === i)); }}); });

function slide(c, d) {   // move a closed shape up d frets; names re-spelled, and the notes re-checked against the original quality

  if (before.join() !== after.join()) { console.error('slide changed the chord', c.name); return null; }

// asserted in pwa/export_staff.py; this only draws what it is handed. Layers: tab · rhythm · names · staff · bars · key.
const STAFF_LAYERS = [['tab', 'Tab'], ['rhythm', 'Rhythm'], ['names', 'Note names'], ['staff', 'The staff'], ['bars', 'Bars & time'], ['key', 'Key & accidentals']];
const CLEF_FONT = "'Bravura','Noto Music','Segoe UI Symbol','Apple Symbols',serif";   // 𝄞 falls back through system music fonts

  const timeX = clefX + 34 + ksig.length * 11;                                  // the time signature sits after the key signature
  const Lx = Math.max(88, timeX + 18);                                          // first note clears the clef, key and time
  const N = L.notes, nb = L.nbars, W = Lx + N.length * dx + (nb - 1) * GAP + rPad;

  const noteY = step => sTop + (8 - step) * (SLG / 2);                          // step 0 = bottom line (E4)
  const tabY = s => tabTop + (5 - s) * dyT;                                     // string 5 (high e) on top
  const headX = 6.2, up = st => st < 4;                                         // stem up below the middle line

    const tap = (s, f) => { if (answered) return; const key = s + ':' + f, cells = grid.querySelectorAll('button'), idx = (5 - s) * 8 + f, btn = cells[idx];
      if (targets.includes(key)) { found.add(key); btn.style.background = 'var(--sage)'; btn.style.color = 'var(--onacc)'; btn.textContent = SH[pc]; btn.disabled = true;
