.tempo2 .bpm{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;min-width:0}
.tempo2 .v span{font-size:10.5px;letter-spacing:.16em;color:var(--mute);font-weight:800}
.icon{border:1.5px solid var(--ink);background:transparent;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink);padding:0}
.icon svg{width:22px;height:22px}
.icon.on{background:var(--ink);color:var(--bg)}
.icon.tap{font-size:11px;font-weight:900;letter-spacing:.08em;border-color:var(--rule)}
.cta{display:flex;align-items:center;gap:12px;min-width:0}
.cta .go{background:var(--acc);color:var(--onacc);border:0;border-radius:999px;height:50px;padding:0 22px 0 18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:10px;flex:none}
.what{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.what>span:first-child{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:800}
.what>span:last-child{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.cta.none .what>span:last-child{color:var(--mute);font-weight:600}
.clock2{display:flex;align-items:center;gap:9px}
.clock2 .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px}
.clock2 .lbl{font-size:10px}
.station{display:flex;align-items:center;gap:8px;flex:none}
.station .dots{display:flex;gap:4px;margin-left:2px}
/* contextual "Numbers to beat" on the Practice page */
.goals-ctx{display:flex;flex-direction:column;gap:8px}
.goal-tiers{display:flex;gap:6px}
.goalchip{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;min-width:0;line-height:1.1}
.goalchip span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.goalchip b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.goalchip.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.goalchip.on span{color:var(--onacc)}
.youline{font-size:13px;font-weight:700}
.pgnum{font-family:var(--display);letter-spacing:.1em;color:var(--mute);font-size:13px;white-space:nowrap;text-transform:uppercase;max-width:20ch;overflow:hidden;text-overflow:ellipsis}
.arrow{width:46px;height:46px;border:1.5px solid var(--ink);font-size:24px;font-weight:600;flex:none;color:var(--ink)}
@media (max-width:980px){ .run{display:none} .hrow h1{white-space:normal} .pgnum{display:none} }
@media (max-width:600px){ .cta .what{display:none} .cta.none .what{display:flex} .cta .go{padding:0 16px 0 14px;font-size:15px} .tempo2 .v{min-width:40px} }
/* IX Writing: slim song-shape row under the bars, compact melody table */
.shape-row{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-top:2px}
.shape-row .label{color:var(--rust)}
.shape-row .tl{flex:1;min-width:200px}
.cells.mel-compact{border-spacing:2px}
.cells.mel-compact td,.cells.mel-compact th{padding:3px 8px 3px 0;font-size:14px}
.prog-list{display:flex;flex-direction:column}
.prog-item{all:unset;cursor:pointer;display:block;padding:6px 6px;border-bottom:1px solid var(--rule)}
.prog-item.on{background:var(--panel)}
.prog-item:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.pl-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pl-top b{font-weight:900;font-size:15px}
.pl-top span{font-size:14px;color:var(--ink2);font-weight:700}
.pl-desc{font-size:12px;color:var(--mute);line-height:1.3;margin-top:1px}
/* --- motion & press feedback: subtle, fast, purposeful (reviewed for an Apple-like feel) --- */
.btn,.chip,.seg button,.icon,.arrow,.go,.thumb,.cbox,.goalchip,.rate button,.toc button,.rt li,.prog-item,.bar,.tempo2 button{transition:transform .12s cubic-bezier(.2,0,.2,1),background-color .16s ease-out,color .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out,opacity .12s ease-out}
:is(.btn,.chip,.seg button,.icon,.arrow,.thumb,.goalchip,.rate button,.toc button,.tempo2 button):active{transform:scale(.96)}
.go:active{transform:scale(.975)}
.cbox.on{transform:scale(1.03)}
.play::before{transition:border-width .14s ease-out,width .14s ease-out,height .14s ease-out}
.arrow svg{width:22px;height:22px} .tempo2 button svg{width:20px;height:20px}
.pbar .beats i{transition:transform .09s ease-out,background-color .09s ease-out}
.pbar .beats i.on{transform:scale(1.35)} .pbar .beats i.on.one{transform:scale(1.5)}
.sgrid .st{transition:background .08s ease-out,transform .08s ease-out}
.sgrid .st.now{transform:scale(1.04)}
@keyframes gm-right{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes gm-wrong{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.gm-right{animation:gm-right .3s ease-out} .gm-wrong{animation:gm-wrong .32s cubic-bezier(.36,.07,.19,.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Theory Lab: the facts feed and the circle-of-fifths wheel */
.facts{display:flex;flex-direction:column;gap:10px}
.fact{border-left:3px solid var(--navy);background:var(--panel);border-radius:0 10px 10px 0;padding:9px 14px}
.fact h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.fact p{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}
.wheel{position:relative;width:300px;height:300px;margin:4px auto;max-width:100%}
.wheel .ring{position:absolute;inset:14px;border-radius:50%;border:1.5px dashed var(--rule)}

ectly opposite, F♯/G♭ has six of each — the furthest you can get from home.","tag":"cof"},{"t":"C major","b":"C major is home base — no sharps, no flats. Its relative minor is Am.","tag":"cof"},{"t":"G major","b":"G major has 1 sharp. Its relative minor is Em, and its V chord is D.","tag":"cof"},{"t":"D major","b":"D major has 2 sharps. Its relative minor is Bm, and its V chord is A.","tag":"cof"},{"t":"A major","b":"A major has 3 sharps. Its relative minor is F♯m, and its V chord is E.","tag":"cof"},{"t":"E major","b":"E major has 4 sharps. Its relative minor is C♯m, and its V chord is B.","tag":"cof"},{"t":"B major","b":"B major has 5 sharps. Its relative minor is G♯m, and its V chord is F♯.","tag":"cof"},{"t":"F♯ major","b":"F♯ major has 6 sharps. Its relative minor is D♯m, and its V chord is D♭.","tag":"cof"},{"t":"D♭ major","b":"D♭ major has 5 flats. Its relative minor is B♭m, and its V chord is A♭.","tag":"cof"},{"t":"A♭ major","b":"A♭ major has 4 flats. Its relative minor is Fm, and its V chord is E♭.","tag":"cof"},{"t":"E♭ major","b":"E♭ major has 3 flats. Its relative minor is Cm, and its V chord is B♭.","tag":"cof"},{"t":"B♭ major","b":"B♭ major has 2 flats. Its relative minor is Gm, and its V chord is F.","tag":"cof"},{"t":"F major","b":"F major has 1 flat. Its relative minor is Dm, and its V chord is C.","tag":"cof"},{"t":"What an interval is","b":"The distance between two notes, measured in semitones — one semitone is one fret. Name the distance and you can hear it coming.","tag":"intervals"},{"t":"Perfect fifth","b":"Seven semitones. The strongest, most open interval after the octave — the backbone of a power chord.","tag":"intervals"},{"t":"Major vs minor third","b":"A major third is four semitones (bright); a minor third is three (darker). That single semitone is the whole difference between a major and a minor chord.","tag":"intervals"},{"t":"The tritone","b":"Six semitones — exactly half the octave. It sounds unstable and \"wants\" to resolve, which is what gives a dominant 7 chord its pull home.","tag":"intervals"},{"t":"Octave","b":"Twelve semitones — the same note, higher. The two notes share a name because one vibrates exactly twice as fast as the other.","tag":"intervals"},{"t":"Consonant and dissonant","b":"Octaves, fifths and thirds sound settled (consonant); seconds, sevenths and the tritone sound tense (dissonant). Music is the push and pull between them.","tag":"intervals"},{"t":"Intervals build chords","b":"Stack a major third then a minor third from a root and you get a major chord; flip them and it’s minor. Chords are just intervals piled up.","tag":"intervals"},{"t":"Chords in a key","b":"Build a chord on each note of the major scale and you get a fixed pattern: major, minor, minor, major, major, minor, diminished — I ii iii IV V vi vii°.","tag":"key"},{"t":"I, IV and V","b":"The three major chords in a major key. Thousands of songs are just these three. In C that’s C, F and G.","tag":"key"},{"t":"The vi chord","b":"The relative minor, and the most-used minor chord in pop. I–V–vi–IV (C–G–Am–F) is the \"four-chord song\".","tag":"key"},{"t":"Roman numerals","b":"Capital numerals are major chords, lower-case are minor, and ° means diminished. They describe a progression in any key at once.","tag":"key"},{"t":"The V wants to go home","b":"The fifth chord pulls hardest back to the I. That tension-and-release, V to I, is how most phrases land.","tag":"key"},{"t":"Borrowing chords","b":"Slipping in a chord from the parallel minor (a ♭VII or iv) adds colour without leaving the key for long.","tag":"key"},{"t":"A major scale","b":"Whole, whole, half, whole, whole, whole, half. That fixed pattern of steps is what makes a scale sound \"major\" no matter which note you start on.","tag":"scales"},{"t":"What makes a key","b":"A key is a home note plus the seven notes of its scale. The key signature just records which of those notes are sharp or flat.","tag":"scales"},{"t":"Modes are one scale, seven homes","b":"Start the major scale on each of its notes and you get the seven modes — same notes, different centre. Start on the 2nd and it’s Dorian; the 6th gives the natural minor.","tag":"scales"},{"t":"Major vs minor at a glance","b":"The third degree tells you the mood: a major third (4 semitones from home) sounds bright, a minor third (3) sounds dark.","tag":"scales"},{"t":"The pentatonic","b":"Drop the two \"tense\" notes (the 4th and 7th) from the major scale and you get the five-note major pentatonic — almost impossible to play a wrong note.","tag":"scales"},{"t":"Dorian vs natural minor","b":"One note apart: Dorian has a natural 6th, natural minor has a ♭6. That single raised note is what gives Dorian its hopeful, jazzy lift.","tag":"scales"},{"t":"Capo = a movable nut","b":"A capo shortens every string by the same amount, so a shape you already know sounds in a higher key. Capo 2 with a G shape sounds in A.","tag":"capo"},{"t":"Each fret is a semitone","b":"Every fret you move the capo raises the key by one semitone. Capo 1 = up a half step, capo 2 = a whole step, and so on.","tag":"capo"},{"t":"Same shape, new voice","b":"Capoing up and using open shapes keeps that bright, ringing open-string sound in a key where the barre chords would sound heavier.","tag":"capo"},{"t":"Matching a singer","b":"If a song is too low, capo up until it sits in your voice — you keep the same chord shapes, just higher.","tag":"capo"},{"t":"Two guitars, one capo","b":"One guitar plays open chords, the other capos up and plays different shapes for the same chords — the two parts shimmer against each other.","tag":"capo"},{"t":"The 12th fret repeats","b":"At the 12th fret every string is an octave above its open note, and the whole pattern starts over. Learn the first twelve frets and you know them all.","tag":"fretboard"},{"t":"No note between B–C or E–F","b":"Those two pairs are only a semitone (one fret) apart; everywhere else there’s a sharp/flat between the letters.","tag":"fretboard"},{"t":"The open strings","b":"Low to high: E A D G B E. The outer two are both E, two octaves apart — handy for finding your bearings.","tag":"fretboard"},{"t":"Octave shapes","b":"The same note sits two strings up and two frets over (or three strings up and three frets back). Learn one octave shape and you can name any note from one you know.","tag":"fretboard"},{"t":"The dots","b":"The inlays at frets 3, 5, 7, 9 and the double dot at 12 are a map — most players navigate by them without thinking.","tag":"fretboard"}]}};

      build(null, ok ? {correct: i, lit: T.lit} : {wrong: i, correct: T.ans, lit: T.lit});
      fb.replaceChildren(h('span', {style: `color:var(--${ok ? 'sage' : 'rust'})`}, ok ? `Right — ${COF[T.ans][0]}.` : `The answer is ${COF[T.ans][0]}.`), h('button', {class: 'btn', style: 'margin-left:14px', on: {click: ask}}, 'Next')); };
    ask();
  } else if (st.topic === 'intervals') {
    const info = h('div', {style: 'font-weight:800;margin-bottom:8px'}), opts = h('div', {style: 'display:flex;flex-wrap:wrap;gap:10px'}), fb = h('div', {style: 'min-height:40px;margin-top:12px;font-weight:800'});
    const root = 52; let T, answered;
    const play = () => { audio(); const t0 = A.ctx.currentTime + .05; playMidi(root, t0, {kind: 'note', gain: .4}); playMidi(root + T.n, t0 + .5, {kind: 'note', gain: .4}); };
    const playBtn = h('button', {class: 'btn acc', style: 'min-height:52px', on: {click: play}}, '► Hear it again');
    host.append(info, playBtn, opts, fb);
    const ask = () => { answered = false; const i = Math.floor(Math.random() * 12); T = {n: IV[i][0], name: IV[i][1]};
      info.textContent = 'Listen, then name the interval:'; const choices = shuffle([IV[i][1], ...sample(IV.filter((_, j) => j !== i), 3).map(r => r[1])]);
      opts.replaceChildren(...choices.map(c => h('button', {class: 'btn', style: 'min-height:48px', on: {click: () => answer(c)}}, c))); fb.textContent = ''; play(); };
    const answer = c => { if (answered) return; answered = true; const ok = c === T.name; bump(ok); flash(fb, ok);
      fb.replaceChildren(h('span', {style: `color:var(--${ok ? 'sage' : 'rust'})`}, ok ? `Right — a ${T.name}.` : `That was a ${T.name}.`), h('button', {class: 'btn', style: 'margin-left:14px', on: {click: ask}}, 'Next')); };
    ask();
  } else if (st.topic === 'key') {
    const info = h('div', {style: 'font-weight:800;margin-bottom:8px'}), row = h('div', {style: 'display:flex;flex-wrap:wrap;gap:10px'}), fb = h('div', {style: 'min-height:40px;margin-top:12px;font-weight:800'});
    host.append(info, row, fb); let tonic, want, answered;
    const ask = () => { answered = false; tonic = KEYS[Math.floor(Math.random() * 12)]; want = Math.floor(Math.random() * 7);
      info.textContent = `In ${tonic} major, tap the ${roman(PAL[want], false)} chord.`;
      row.replaceChildren(...PAL.map((t, i) => h('button', {class: 'btn', style: 'min-height:56px;min-width:64px;flex-direction:column;gap:0', on: {click: () => answer(i) }},
        h('b', {style: 'font-size:17px'}, chordName(tonic, false, t).name), h('span', {class: 'muted', style: 'font-size:10px;letter-spacing:.1em'}, roman(t, false))))); fb.textContent = ''; };
    const answer = i => { if (answered) return; answered = true; const ok = i === want; bump(ok); flash(fb, ok);
      [...row.children].forEach((b, i2) => { if (i2 === want) b.style.background = 'var(--sage)'; else if (i2 === i && !ok) b.style.background = 'var(--rust)'; });
      fb.replaceChildren(h('span', {style: `color:var(--${ok ? 'sage' : 'rust'})`}, ok ? 'Right.' : `The ${roman(PAL[want], false)} is ${chordName(tonic, false, PAL[want]).name}.`), h('button', {class: 'btn', style: 'margin-left:14px', on: {click: ask}}, 'Next')); };
    ask();
  } else if (st.topic === 'scales') {
    const DEG = ['1', '♭2', '2', '♭3', '3', '4', '♯4', '5', '♭6', '6', '♭7', '7'];
    const info = h('div', {style: 'font-weight:800;margin-bottom:8px'}), row = h('div', {style: 'display:flex;flex-wrap:wrap;gap:8px'}), fb = h('div', {style: 'min-height:40px;margin-top:12px;font-weight:800'});
    host.append(info, row, fb); let s, found, answered;
    const ask = () => { answered = false; s = SCL[Math.floor(Math.random() * SCL.length)]; found = new Set();
      info.textContent = `Tap every note in the ${s.name} (degrees from the root).`;
      row.replaceChildren(...DEG.map((d, pc) => h('button', {class: 'chip', style: 'min-width:46px;min-height:46px', on: {click: () => tap(pc) }}, d))); fb.textContent = ''; };
    const tap = pc => { if (answered) return; const btn = row.children[pc];
      if (s.steps.includes(pc)) { found.add(pc); btn.style.background = 'var(--sage)'; btn.style.color = 'var(--onacc)'; btn.disabled = true;
        if (found.size === s.steps.length) { answered = true; bump(true); flash(fb, true);
          fb.replaceChildren(h('span', {style: 'color:var(--sage)'}, `That’s the ${s.name}.`), h('button', {class: 'btn', style: 'margin-left:14px', on: {click: ask}}, 'Next')); } }
      else { flash(btn, false); bump(false); } };
    ask();
  } else if (st.topic === 'capo') {
    const info = h('div', {style: 'font-weight:800;margin-bottom:8px'}), frets = h('div', {style: 'display:flex;gap:8px;flex-wrap:wrap'}), fb = h('div', {style: 'min-height:40px;margin-top:12px;font-weight:800'});
    host.append(info, frets, fb); let sh, key, ans, answered;
    const ask = () => { answered = false; sh = SHAPES[Math.floor(Math.random() * SHAPES.length)]; ans = 1 + Math.floor(Math.random() * 7); key = CAPO[sh][ans];
      info.textContent = `Where do you put the capo so a ${sh} shape sounds in ${key}?`;
      frets.replaceChildren(...Array.from({length: 8}, (_, f) => h('button', {class: 'chip', style: 'min-width:56px;min-height:48px;flex-direction:column;gap:0', on: {click: () => answer(f) }},
        h('b', {}, f === 0 ? 'open' : 'fret ' + f)))); fb.textContent = ''; };
    const answer = f => { if (answered) return; answered = true; const ok = CAPO[sh][f] === key; bump(ok); flash(fb, ok);
      frets.children[ans].style.background = 'var(--sage)'; if (!ok) frets.children[f].style.background = 'var(--rust)';
      fb.replaceChildren(h('span', {style: `color:var(--${ok ? 'sage' : 'rust'})`}, ok ? 'Right.' : `Capo ${ans} makes a ${sh} shape sound in ${key}.`), h('button', {class: 'btn', style: 'margin-left:14px', on: {click: ask}}, 'Next')); };
    ask();
  } else {   // fretboard — tap every instance of a note on a mini neck (frets 0–7)
    const info = h('div', {style: 'font-weight:800;margin-bottom:8px'}), grid = h('div', {}), fb = h('div', {style: 'min-height:40px;margin-top:12px;font-weight:800'});
    host.append(info, grid, fb); let pc, targets, found, answered;
    const ask = () => { answered = false; pc = Math.floor(Math.random() * 12); found = new Set(); targets = [];
      for (let s = 0; s < 6; s++) for (let f = 0; f <= 7; f++) if ((OPEN_PC[s] + f) % 12 === pc) targets.push(s + ':' + f);
      info.textContent = `Tap every ${SH[pc]} on the neck (frets 0–7).`;
      grid.replaceChildren(h('div', {style: 'display:inline-grid;grid-template-columns:auto repeat(8,38px);gap:4px;align-items:center'},
        h('div', {}), ...[0,1,2,3,4,5,6,7].map(f => h('div', {style: 'text-align:center;font-size:12px;font-weight:800;color:var(--mute)'}, String(f))),
        ...[5,4,3,2,1,0].flatMap(s => [h('div', {style: 'font-weight:800;font-size:13px;color:var(--mute);padding-right:6px'}, 'EADGBe'[s]),
          ...[0,1,2,3,4,5,6,7].map(f => h('button', {class: 'chip', style: 'height:36px;min-width:0;padding:0', on: {click: () => tap(s, f) }}, ''))]))); fb.textContent = ''; };
    const tap = (s, f) => { if (answered) return; const key = s + ':' + f, cells = grid.querySelectorAll('button'), idx = (5 - s) * 8 + f, btn = cells[idx];
      if (targets.includes(key)) { found.add(key); btn.style.background = 'var(--sage)'; btn.style.color = 'var(--onacc)'; btn.textContent = SH[pc]; btn.disabled = true;
        if (found.size === targets.length) { answered = true; bump(true); flash(fb, true);
          fb.replaceChildren(h('span', {style: 'color:var(--sage)'}, `All ${targets.length} ${SH[pc]}s.`), h('button', {class: 'btn', style: 'margin-left:14px', on: {click: ask}}, 'Next')); } }
      else { flash(btn, false); bump(false); } };
    ask();
  }
}
