  --p1:#3a6b55; --p2:#6f7a37; --p3:#9c3d26; --p4:#7a4a34; --p5:#3c4e6b;

}
/* Moon — the cool near-black night palette; moonlight silver/steel-blue, blackletter title */
:root[data-theme="moon"]{
  --bg:#0a0c10; --panel:#13161c; --panel2:#1b1f27; --ink:#dfe6ee; --ink2:#aab4c0; --mute:#78828f; --rule:#262c36;
  --rust:#7fa6c9; --gold:#b9c2cf; --wire:#333a46; --str:#cdd4dd; --onacc:#0a0c10; --dark:#000; --ondark:#dfe6ee;
  --p1:#6e93a8; --p2:#7f9a86; --p3:#9a8fb0; --p4:#8a97ab; --p5:#6477a0;
  --teal:#6e93a8; --sage:#7f9a86; --plum:#9a8fb0; --navy:#6477a0;
  --ok:#7f9a86; --warn:#b9c2cf; --bad:#c76b6b; --acc:#8fb3d6;
  --title:'UnifrakturMaguntia','Cinzel',serif; color-scheme:dark;
}
:root[data-theme="moon"] .brand-t{text-transform:none!important;letter-spacing:.012em!important}

[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}

button,select,a{touch-action:manipulation}
svg text{font-family:var(--body)}
.book{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;min-height:0;overflow:hidden;position:relative}   /* the frame: clips the content, never lays it out */
.page.scrollable{overflow-y:auto}

.pg{display:flex;flex-direction:column;gap:10px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:turn .3s cubic-bezier(.32,.72,0,1)}

/* the book header */

.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{color:var(--ink2);font-size:15px;font-weight:500;flex:1 1 auto;min-width:0;padding-bottom:1px}
.hd .book-t{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-align:right;line-height:1.2;padding-bottom:1px}
.band{color:var(--ink);height:20px;display:block;width:100%;flex:none}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;flex:none}
.pick{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick>span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
select{border:1.5px solid var(--ink);background:var(--bg);border-radius:9px;padding:8px 34px 8px 12px;font-weight:800;font-size:16px;min-height:44px;max-width:100%;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:7px 10px;font-weight:800;font-size:15px;min-width:44px;min-height:44px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:9px;padding:8px 14px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.play::before{content:"";width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.on::before{width:10px;height:12px;border:0;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor;box-sizing:border-box}
:is(.btn,.chip,.seg button,select,.cbox,.thumb,.toc button,.arrow,.rt li,.go,.icon,.tempo2 button,.rate button,.goalchip):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* sections: line-only, coloured top rule, Tenor heading with a stepped diamond */
.body{flex:1;min-height:0;display:grid;gap:14px 22px}
.sec{border-top:2.5px solid var(--c,var(--ink));padding-top:7px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}

/* diagrams */
.cgrid{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px 10px;align-items:end}

.thumb[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.big{display:flex;justify-content:center}.big svg{width:auto;max-width:100%;height:auto;max-height:430px}
/* tables */
table.t{width:100%;border-collapse:collapse}

.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}

/* the practice bar, on every page */
.pbar{flex:none;z-index:10;min-height:calc(var(--barh) + env(safe-area-inset-bottom,0px));flex-wrap:wrap;row-gap:6px;padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:10px;background:var(--bg)}

welve keys arranged in a ring. Each step clockwise jumps up a perfect fifth and adds one sharp; each step counter-clockwise goes up a fourth and adds one flat.","tag":"cof"},{"t":"Why \"fifths\"?","b":"Stack perfect fifths — C, G, D, A, E… — and you walk through all twelve notes before landing back on C. That path, bent into a ring, is the circle.","tag":"cof"},{"t":"Neighbors are friends","b":"Keys that sit next to each other share almost all their notes, so music slips between them easily. C’s neighbors are G and F.","tag":"cof"},{"t":"I–IV–V lives on the circle","b":"For any key, the key one step clockwise is its V chord and one step counter-clockwise is its IV. Three touching keys give you the three chords most songs are built from.","tag":"cof"},{"t":"Relative minors","b":"Every major key shares its notes with a minor key a minor third below — A minor for C major, E minor for G. Same notes, different home base.","tag":"cof"},{"t":"Order of sharps","b":"Sharps are added F C G D A E B. One sharp (key of G) is F♯; two (D) is F♯ C♯; three (A) adds G♯ — always the next letter in that list.","tag":"cof"},{"t":"Order of flats","b":"Flats add in the reverse order: B E A D G C F. One flat (key of F) is B♭; two (B♭) is B♭ E♭.","tag":"cof"},{"t":"The top and bottom","b":"C major sits at the top with no sharps or flats. Directly opposite, F♯/G♭ has six of each — the furthest you can get from home.","tag":"cof"},{"t":"C major","b":"C major is home base — no sharps, no flats. Its relative minor is Am.","tag":"cof"},{"t":"G major","b":"G major has 1 sharp. Its relative minor is Em, and its V chord is D.","tag":"cof"},{"t":"D major","b":"D major has 2 sharps. Its relative minor is Bm, and its V chord is A.","tag":"cof"},{"t":"A major","b":"A major has 3 sharps. Its relative minor is F♯m, and its V chord is E.","tag":"cof"},{"t":"E major","b":"E major has 4 sharps. Its relative minor is C♯m, and its V chord is B.","tag":"cof"},{"t":"B major","b":"B major has 5 sharps. Its relative minor is G♯m, and its V chord is F♯.","tag":"cof"},{"t":"F♯ major","b":"F♯ major has 6 sharps. Its relative minor is D♯m, and its V chord is D♭.","tag":"cof"},{"t":"D♭ major","b":"D♭ major has 5 flats. Its relative minor is B♭m, and its V chord is A♭.","tag":"cof"},{"t":"A♭ major","b":"A♭ major has 4 flats. Its relative minor is Fm, and its V chord is E♭.","tag":"cof"},{"t":"E♭ major","b":"E♭ major has 3 flats. Its relative minor is Cm, and its V chord is B♭.","tag":"cof"},{"t":"B♭ major","b":"B♭ major has 2 flats. Its relative minor is Gm, and its V chord is F.","tag":"cof"},{"t":"F major","b":"F major has 1 flat. Its relative minor is Dm, and its V chord is C.","tag":"cof"},{"t":"What an interval is","b":"The distance between two notes, measured in semitones — one semitone is one fret. Name the distance and you can hear it coming.","tag":"intervals"},{"t":"Perfect fifth","b":"Seven semitones. The strongest, most open interval after the octave — the backbone of a power chord.","tag":"intervals"},{"t":"Major vs minor third","b":"A major third is four semitones (bright); a minor third is three (darker). That single semitone is the whole difference between a major and a minor chord.","tag":"intervals"},{"t":"The tritone","b":"Six semitones — exactly half the octave. It sounds unstable and \"wants\" to resolve, which is what gives a dominant 7 chord its pull home.","tag":"intervals"},{"t":"Octave","b":"Twelve semitones — the same note, higher. The two notes share a name because one vibrates exactly twice as fast as the other.","tag":"intervals"},{"t":"Consonant and dissonant","b":"Octaves, fifths and thirds sound settled (consonant); seconds, sevenths and the tritone sound tense (dissonant). Music is the push and pull between them.","tag":"intervals"},{"t":"Intervals build chords","b":"Stack a major third then a minor third from a root and you get a major chord; flip them and it’s minor. Chords are just intervals piled up.","tag":"intervals"},{"t":"Chords in a key","b":"Build a chord on each note of the major scale and you get a fixed pattern: major, minor, minor, major, major, minor, diminished — I ii iii IV V vi vii°.","tag":"key"},{"t":"I, IV and V","b":"The three major chords in a major key. Thousands of songs are just these three. In C that’s C, F and G.","tag":"key"},{"t":"The vi chord","b":"The relative minor, and the most-used minor chord in pop. I–V–vi–IV (C–G–Am–F) is the \"four-chord song\".","tag":"key"},{"t":"Roman numerals","b":"Capital numerals are major chords, lower-case are minor, and ° means diminished. They describe a progression in any key at once.","tag":"key"},{"t":"The V wants to go home","b":"The fifth chord pulls hardest back to the I. That tension-and-release, V to I, is how most phrases land.","tag":"key"},{"t":"Borrowing chords","b":"Slipping in a chord from the parallel minor (a ♭VII or iv) adds colour without leaving the key for long.","tag":"key"},{"t":"A major scale","b":"Whole, whole, half, whole, whole, whole, half. That fixed pattern of steps is what makes a scale sound \"major\" no matter which note you start on.","tag":"scales"},{"t":"What makes a key","b":"A key is a home note plus the seven notes of its scale. The key signature just records which of those notes are sharp or flat.","tag":"scales"},{"t":"Modes are one scale, seven homes","b":"Start the major scale on each of its notes and you get the seven modes — same notes, different centre. Start on the 2nd and it’s Dorian; the 6th gives the natural minor.","tag":"scales"},{"t":"Major vs minor at a glance","b":"The third degree tells you the mood: a major third (4 semitones from home) sounds bright, a minor third (3) sounds dark.","tag":"scales"},{"t":"The pentatonic","b":"Drop the two \"tense\" notes (the 4th and 7th) from the major scale and you get the five-note major pentatonic — almost impossible to play a wrong note.","tag":"scales"},{"t":"Dorian vs natural minor","b":"One note apart: Dorian has a natural 6th, natural minor has a ♭6. That single raised note is what gives Dorian its hopeful, jazzy lift.","tag":"scales"},{"t":"Capo = a movable nut","b":"A capo shortens every string by the same amount, so a shape you already know sounds in a higher key. Capo 2 with a G shape sounds in A.","tag":"capo"},{"t":"Each fret is a semitone","b":"Every fret you move the capo raises the key by one semitone. Capo 1 = up a half step, capo 2 = a whole step, and so on.","tag":"capo"},{"t":"Same shape, new voice","b":"Capoing up and using open shapes keeps that bright, ringing open-string sound in a key where the barre chords would sound heavier.","tag":"capo"},{"t":"Matching a singer","b":"If a song is too low, capo up until it sits in your voice — you keep the same chord shapes, just higher.","tag":"capo"},{"t":"Two guitars, one capo","b":"One guitar plays open chords, the other capos up and plays different shapes for the same chords — the two parts shimmer against each other.","tag":"capo"},{"t":"The 12th fret repeats","b":"At the 12th fret every string is an octave above its open note, and the whole pattern starts over. Learn the first twelve frets and you know them all.","tag":"fretboard"},{"t":"No note between B–C or E–F","b":"Those two pairs are only a semitone (one fret) apart; everywhere else there’s a sharp/flat between the letters.","tag":"fretboard"},{"t":"The open strings","b":"Low to high: E A D G B E. The outer two are both E, two octaves apart — handy for finding your bearings.","tag":"fretboard"},{"t":"Octave shapes","b":"The same note sits two strings up and two frets over (or three strings up and three frets back). Learn one octave shape and you can name any note from one you know.","tag":"fretboard"},{"t":"The dots","b":"The inlays at frets 3, 5, 7, 9 and the double dot at 12 are a map — most players navigate by them without thinking.","tag":"fretboard"},{"t":"Why the B string is different","b":"Every pair of neighbouring strings is a perfect fourth apart except G to B, a major third. Any shape that crosses from the G to the B string moves up one fret to stay the same.","tag":"fretboard"},{"t":"Tuning without a tuner","b":"Fret 5 of each string matches the next open string up — except the G string, where fret 4 matches the open B. Tune the low E first, then work across.","tag":"fretboard"},{"t":"Counting a bar","b":"In 4/4 count \"1 & 2 & 3 & 4 &\". Quarter notes land on the numbers; eighth notes fill the &s too. Say the count out loud and the rhythm stops being guesswork.","tag":"rhythm"},{"t":"Each value halves","b":"A whole note is two halves, a half is two quarters, a quarter is two eighths, an eighth is two sixteenths. Rests follow the same ladder.","tag":"rhythm"},{"t":"Dots and ties","b":"A dot adds half a note’s own length; a tie joins two notes into one longer one. Both make lengths the plain values can’t: a dotted half is 3 beats.","tag":"rhythm"},{"t":"Simple and compound time","b":"In simple time (2/4, 3/4, 4/4) each beat splits in two. In compound time (6/8, 12/8) each beat splits in three — the lilt of a jig or a slow blues.","tag":"rhythm"},{"t":"Tab and staff together","b":"Tab tells you where to put your fingers; the staff tells you how long each note lasts. Most guitar books print both, one above the other.","tag":"rhythm"},{"t":"Guitar sounds an octave low","b":"Guitar music is written in treble clef an octave higher than it sounds, so the notes sit on the staff instead of on a forest of ledger lines.","tag":"rhythm"},{"t":"Four kinds of seventh chord","b":"Major 7 (dreamy), dominant 7 (restless, bluesy), minor 7 (mellow) and half-diminished (tense). Each is a triad with one more third on top.","tag":"harmony"},{"t":"Why V pulls to I","b":"The V chord holds the leading tone, a half step under home. In V7 that note and the ♭7 form a tritone, and the tritone collapses into the I chord.","tag":"harmony"},{"t":"Cadences are punctuation","b":"V → I is a full stop, a phrase ending on V is a comma, IV → I is a soft \"Amen\", and V → vi is a surprise that keeps the song going.","tag":"harmony"},{"t":"Relative versus parallel","b":"Relative keys share their notes (C major and A minor). Parallel keys share their home note (C major and C minor). Borrowed chords come from the parallel key.","tag":"harmony"},{"t":"Three minor scales","b":"Natural minor is the plain one. Harmonic minor raises the 7th so V turns major. Melodic minor raises the 6th and 7th on the way up for a smoother climb.","tag":"harmony"},{"t":"Inversions and slash chords","b":"Put the 3rd or 5th of a chord in the bass and it is inverted. Writing it as a slash chord, like G/B, tells you which bass note to play.","tag":"harmony"},{"t":"Keep the strumming hand moving","b":"Down on the beats, up on the &s, all the time. Skip strings by missing them, not by stopping — the swing of the arm is the clock.","tag":"technique"},{"t":"Thumb first","b":"In fingerstyle, learn the thumb’s bass part alone until it runs without thought, then add the fingers one at a time.","tag":"technique"},{"t":"Hammer-ons and pull-offs","b":"Pick once and let the fretting hand sound the next notes. It is smoother and faster than picking every note, and it is half of lead guitar.","tag":"technique"},{"t":"Bend to a pitch","b":"Play the note you are aiming for, then bend the lower note until it matches. A bend that falls short sounds out of tune, not bluesy.","tag":"technique"},{"t":"Mute what you are not playing","b":"Clean playing is as much silence as sound: the side of the fretting fingers and the picking palm stop the strings you don’t want.","tag":"technique"},{"t":"Slow is the fast way","b":"Practise at a tempo where you make no mistakes, then raise it a few BPM. Mistakes repeated at speed are what the hands learn.","tag":"technique"},{"t":"Sections have jobs","b":"The verse tells the story, the chorus repeats the hook, the pre-chorus builds into it, and the bridge gives contrast before the last chorus.","tag":"form"},{"t":"Letters for form","b":"Musicians label sections with letters: AABA means the same tune twice, a contrasting B section, then the tune once more. ABAB alternates verse and chorus.","tag":"form"},{"t":"The 12-bar blues","b":"Twelve bars of I, IV and V in a fixed order, ending with a turnaround that pulls back to the top. Hundreds of songs share it.","tag":"form"},{"t":"Contrast keeps it alive","b":"A bridge or solo changes something — chords, rhythm, register — so the return of the chorus feels like coming home.","tag":"form"}]},"concepts":[{"id":"half-step","term":"Half step","short":"The smallest move in Western music — one fret on the guitar. Also called a semitone.","more":"B to C and E to F are half steps with no note between them; everywhere else there is a sharp or flat in the gap.","see":["whole-step","fret","interval"]},{"id":"whole-step","term":"Whole step","short":"Two half steps — two frets. Also called a tone.","more":"The major scale is built mostly from whole steps, with two half steps in it.","see":["half-step","major-scale"]},{"id":"semitone","term":"Semitone","short":"Another name for a half step — one fret.","more":"","see":["half-step"]},{"id":"sharp","term":"Sharp (♯)","short":"One half step higher. F♯ is one fret above F.","more":"Keys on the right-hand side of the circle of fifths use sharps; they are added in the order F C G D A E B.","see":["flat","half-step","accidental","key-signature"]},{"id":"flat","term":"Flat (♭)","short":"One half step lower. B♭ is one fret below B.","more":"Keys on the left-hand side of the circle use flats, added in the order B E A D G C F.","see":["sharp","half-step","accidental","key-signature"]},{"id":"natural","term":"Natural","short":"A note with no sharp or flat — the plain letters A B C D E F G.","more":"","see":["sharp","flat"]},{"id":"accidental","term":"Accidental","short":"A sharp or flat that colours a note.","more":"In a key signature they apply for the whole piece; written mid-bar they last only to the end of that bar.","see":["sharp","flat","key-signature"]},{"id":"note","term":"Note","short":"A single pitch — one sound at one height.","more":"On the guitar every fret on every string is a note; the 12th fret repeats the open string an octave up.","see":["octave","fret"]},{"id":"octave","term":"Octave","short":"The same note higher or lower — twelve half steps apart.","more":"The two notes share a name because one vibrates exactly twice as fast as the other.","see":["note","interval"]},{"id":"interval","term":"Interval","short":"The distance between two notes, measured in half steps (frets).","more":"Name the distance and you can hear it coming — a fifth, a third, an octave. Chords are intervals stacked up.","see":["half-step","third","fifth","octave"]},{"id":"third","term":"Third","short":"A three- or four-fret interval that sets a chord’s mood.","more":"A major third (4 frets) sounds bright; a minor third (3 frets) sounds dark. That one fret is the whole difference between a major and a minor chord.","see":["interval","major-chord","minor-chord"]},{"id":"fifth","term":"Perfect fifth","short":"A seven-fret interval — the strongest, most open sound after the octave.","more":"The root and fifth together are a power chord.","see":["interval","triad"]},{"id":"tritone","term":"Tritone","short":"Six half steps — exactly half an octave. It sounds unstable and wants to resolve.","more":"That tension is what gives a dominant 7 chord its pull back home.","see":["interval","seventh-chord"]},{"id":"scale","term":"Scale","short":"A set of notes, in order, that a piece of music draws from — a home note plus its family.","more":"","see":["major-scale","minor-scale","pentatonic","key"]},{"id":"major-scale","term":"Major scale","short":"Seven notes in the pattern whole-whole-half-whole-whole-whole-half. The bright, do-re-mi sound.","more":"Start that pattern on any note and it sounds major; the pattern is what makes it, not the starting note.","see":["scale","whole-step","mode","key"]},{"id":"minor-scale","term":"Minor scale","short":"The darker cousin of the major scale — it has a flat 3rd, 6th and 7th.","more":"The natural minor is the same notes as a major scale started on its 6th note.","see":["scale","relative-minor","mode"]},{"id":"pentatonic","term":"Pentatonic","short":"A five-note scale — the major scale with its two tense notes (the 4th and 7th) dropped.","more":"Almost impossible to play a wrong note with; the backbone of blues and rock soloing.","see":["scale","major-scale"]},{"id":"mode","term":"Mode","short":"The major scale started on a different note — same notes, different home.","more":"Start on the 2nd note for Dorian, the 6th for natural minor. Seven starting points, seven moods.","see":["major-scale","scale"]},{"id":"key","term":"Key","short":"The home note of a piece plus the scale it lives in. The note everything leans toward.","more":"The key signature records which notes are sharp or flat so you don’t mark every one.","see":["tonic","key-signature","scale","circle-of-fifths"]},{"id":"key-signature","term":"Key signature","short":"The sharps or flats written at the front of the staff that belong to the key.","more":"C major has none; each step around the circle of fifths adds one.","see":["key","sharp","flat","circle-of-fifths"]},{"id":"tonic","term":"Tonic","short":"The home note of a key — the one that feels like rest. The I chord is built on it.","more":"","see":["key","roman-numerals"]},{"id":"root","term":"Root","short":"The note a chord is named after and built up from. The root of a C chord is C.","more":"","see":["chord","triad"]},{"id":"chord","term":"Chord","short":"Three or more notes played together.","more":"Most chords are a root with a third and a fifth stacked on top — a triad.","see":["triad","root","interval"]},{"id":"triad","term":"Triad","short":"The basic three-note chord: a root, a third, and a fifth.","more":"Major or minor depends on the third; stack one more third and you get a seventh chord.","see":["chord","third","fifth","seventh-chord"]},{"id":"major-chord","term":"Major chord","short":"A triad with a major third — the bright, happy sound.","more":"","see":["triad","third","minor-chord"]},{"id":"minor-chord","term":"Minor chord","short":"A triad with a minor third — the darker, sadder sound. One fret separates it from major.","more":"","see":["triad","third","major-chord"]},{"id":"diminished","term":"Diminished","short":"A tense triad of two stacked minor thirds — marked °. It wants to move.","more":"","see":["triad","third"]},{"id":"seventh-chord","term":"Seventh chord","short":"A triad with one more third on top, adding a 7th. Richer, and often restless.","more":"A dominant 7 (like G7) pulls hard back to the key’s home chord.","see":["triad","tritone","roman-numerals"]},{"id":"roman-numerals","term":"Roman numerals","short":"A way to name chords by their place in the key, so a progression works in any key at once.","more":"Capitals are major (I IV V), lower-case are minor (ii iii vi), ° is diminished.","see":["progression","key","tonic"]},{"id":"progression","term":"Progression","short":"A sequence of chords — the skeleton of a song.","more":"I–V–vi–IV is the famous \"four-chord song\".","see":["roman-numerals","chord"]},{"id":"circle-of-fifths","term":"Circle of fifths","short":"The twelve keys arranged in a ring; each step clockwise jumps up a fifth and adds one sharp.","more":"Neighbours share almost all their notes, so music slips easily between them. For any key its V is one step clockwise, its IV one step counter-clockwise.","see":["key","fifth","relative-minor","key-signature"]},{"id":"relative-minor","term":"Relative minor","short":"The minor key that shares a major key’s exact notes, sitting a minor third below.","more":"A minor is the relative minor of C major — same notes, different home.","see":["minor-scale","key","third"]},{"id":"fret","term":"Fret","short":"One of the metal bars on the neck; pressing behind one shortens the string and raises the pitch a half step.","more":"The dots at frets 3, 5, 7, 9 and the double dot at 12 are a map most players navigate by.","see":["half-step","capo"]},{"id":"capo","term":"Capo","short":"A clamp across all the strings that acts as a movable nut, raising every string the same amount.","more":"It lets a shape you know sound in a higher key — capo 2 with a G shape sounds in A.","see":["fret","key","half-step"]},{"id":"tab","term":"Tab","short":"Guitar shorthand: six lines for the six strings, numbers telling you which fret to press.","more":"It shows you where to put your fingers, but not how long each note lasts the way the staff does.","see":["staff","fret"]},{"id":"staff","term":"The staff","short":"The five lines sheet music is written on; a note’s height on them is its pitch.","more":"Unlike tab it shows rhythm and pitch together, and reads on any instrument.","see":["tab","note","time-signature"]},{"id":"time-signature","term":"Time signature","short":"The two stacked numbers at the start of a piece: how many beats per bar, and which note gets the beat.","more":"4/4 — four quarter-note beats a bar — is far and away the most common.","see":["staff","tempo"]},{"id":"tempo","term":"Tempo (BPM)","short":"How fast the beat goes, in beats per minute. Higher BPM is faster.","more":"Practise slow enough to play it clean, then nudge it up.","see":["time-signature"]},{"id":"power-chord","term":"Power chord","short":"Just the root and the fifth — no third, so it is neither major nor minor. The backbone of rock.","more":"Because it has no third, one shape works for a major or a minor chord; slide it anywhere.","see":["root","fifth","chord"]},{"id":"barre","term":"Barre","short":"Flattening one finger across several strings to fret them all at once — it turns an open shape into a moveable one.","more":"Press just behind the fret and let the bony edge of the finger do the work, not the pad.","see":["chord","fret","capo"]},{"id":"arpeggio","term":"Arpeggio","short":"Playing a chord one note at a time instead of all together — a \"broken\" chord.","more":"The heart of fingerstyle: the thumb keeps the bass while the fingers pick the notes above.","see":["chord","note"]},{"id":"open-string","term":"Open string","short":"A string played without pressing any fret, ringing at its natural pitch.","more":"Low to high the open strings are E A D G B E — the ringing notes in open chords.","see":["fret","note","tab"]},{"id":"headstock","term":"Headstock","short":"The top end of the neck that holds the tuners (machine heads), one per string.","more":"Turning a tuner tightens or loosens its string: tighter is higher.","see":["nut","standard-tuning"]},{"id":"nut","term":"Nut","short":"The grooved strip at the top of the fretboard that spaces the strings and starts their vibrating length.","more":"An open string rings from the nut to the bridge; a capo is a movable nut.","see":["headstock","capo","open-string"],"nolink":true},{"id":"fretboard","term":"Fretboard","short":"The front of the neck, divided by frets, where your fretting hand presses the strings. Also called the fingerboard.","more":"","see":["fret","position-markers","nut"]},{"id":"position-markers","term":"Position markers","short":"The dots inlaid at frets 3, 5, 7, 9 and the double dot at 12, so you can find your place at a glance.","more":"Some guitars add markers at 15, 17, 19 and 21 — the same pattern an octave up.","see":["fret","fretboard","octave"]},{"id":"guitar-body","term":"Body","short":"The large part of the guitar you rest against you. It anchors the bridge and, on an acoustic, resonates the sound.","more":"","see":["guitar-bridge","soundhole"],"nolink":true},{"id":"guitar-bridge","term":"Bridge (of the guitar)","short":"Where the strings anchor on the body; it passes their vibration into the guitar top.","more":"The thin strip the strings rest on is the saddle — the far end of their vibrating length.","see":["guitar-body","nut"],"nolink":true},{"id":"soundhole","term":"Soundhole","short":"The round opening in an acoustic guitar’s top that lets the resonating body project its sound.","more":"","see":["guitar-body","pickup"]},{"id":"pickup","term":"Pickup","short":"On an electric guitar, the magnet under the strings that turns their vibration into a signal for the amp.","more":"","see":["soundhole","guitar-body"],"nolink":true},{"id":"string-numbers","term":"String numbers","short":"Strings are numbered 1 to 6 from the thinnest (high E) to the thickest (low E).","more":"So \"the 6th string\" is the thick low E nearest your face when you look down at the guitar.","see":["standard-tuning","open-string"]},{"id":"standard-tuning","term":"Standard tuning","short":"The usual tuning, thick to thin: E A D G B E.","more":"Each string is a perfect fourth above the one before, except G to B, which is a major third — that is why shapes shift a fret when they cross the B string.","see":["open-string","string-numbers","relative-tuning","alternate-tuning"]},{"id":"relative-tuning","term":"Tuning by ear (5th-fret method)","short":"Tune each string to the one below it: fret 5 of one string matches the next open string — except fret 4 of the G string, which matches the open B.","more":"","see":["standard-tuning","octave"]},{"id":"alternate-tuning","term":"Alternate tuning","short":"Any tuning other than E A D G B E. Drop D, DADGAD and the open tunings are the common ones.","more":"Drop D lowers the 6th string a whole step to D for a deeper bass. Open G (D G D G B D) makes the open strings a G major chord, so one finger across a fret plays a whole chord.","see":["standard-tuning","drop-d","open-tuning"]},{"id":"drop-d","term":"Drop D","short":"Standard tuning with the 6th string lowered a whole step to D: D A D G B E.","more":"The low three strings then make a one-finger power chord.","see":["alternate-tuning","power-chord"]},{"id":"open-tuning","term":"Open tuning","short":"A tuning whose open strings sound a chord — Open G, Open D and Open C are the usual ones.","more":"A straight bar across any fret then plays that chord moved up; slide guitar lives here.","see":["alternate-tuning","barre"]},{"id":"musical-alphabet","term":"Musical alphabet","short":"The seven note letters A B C D E F G, which repeat in every octave. There is no H.","more":"Between the letters sit the sharps and flats, making twelve notes in all.","see":["natural","chromatic","octave"]},{"id":"chromatic","term":"Chromatic","short":"Using all twelve notes, one half step apart — the \"note circle\". A chromatic scale climbs one fret at a time.","more":"Its opposite is diatonic: using only the seven notes of the key.","see":["half-step","diatonic","musical-alphabet"]},{"id":"enharmonic","term":"Enharmonic","short":"Two names for the same pitch, like F♯ and G♭.","more":"The key decides which name you write: G major uses F♯, D♭ major uses G♭.","see":["sharp","flat","key-signature"]},{"id":"double-sharp","term":"Double sharp (𝄪) and double flat (𝄫)","short":"Raise or lower a note two half steps. Rare, but they keep a scale’s letters in order in far-off keys.","more":"","see":["sharp","flat","enharmonic"]},{"id":"unison","term":"Unison","short":"Two notes at exactly the same pitch — an interval of zero half steps.","more":"","see":["interval","octave"]},{"id":"octave-shape","term":"Octave shape","short":"The same note two strings over and two frets up (from the 6th or 5th string), or three frets up once you cross the B string.","more":"Know one note and an octave shape names another — the fastest way to learn the neck.","see":["octave","standard-tuning"]},{"id":"chord-box","term":"Chord box","short":"A picture of the neck standing upright: vertical lines are strings, horizontal lines are frets, dots are where to press.","more":"X above a string means leave it out; O means play it open. A thick bar is a barre.","see":["finger-numbers","barre","open-string","muted-note"]},{"id":"finger-numbers","term":"Finger numbers","short":"Fretting fingers are numbered 1 index, 2 middle, 3 ring, 4 pinky. The thumb is T.","more":"Picking-hand fingers have their own letters: p i m a.","see":["chord-box","pima"]},{"id":"scale-diagram","term":"Scale diagram","short":"A map of a scale on the neck. In this book the dots are numbered in playing order, the gold ring is the home note, and a hollow ring left of the nut is an open string.","more":"","see":["scale","root","scale-position"]},{"id":"muted-note","term":"Muted note (x)","short":"An x in tab or a strum pattern: hit the string while it is damped, for a click with no pitch.","more":"Rest the fretting fingers lightly on the strings without pressing them down.","see":["tab","chuck","palm-muting"]},{"id":"beat","term":"Beat","short":"The steady pulse you tap your foot to. Tempo says how fast it goes; the time signature says how beats group.","more":"","see":["tempo","time-signature","bar"],"nolink":true},{"id":"bar","term":"Bar (measure)","short":"One group of beats, boxed between two bar lines. In 4/4 each bar holds four beats.","more":"A double bar line marks the end of a section or piece.","see":["beat","time-signature"],"nolink":true},{"id":"note-values","term":"Note values","short":"How long a note lasts: whole (4 beats in 4/4), half (2), quarter (1), eighth (½), sixteenth (¼).","more":"Each value is half the one before. Flags and beams mark the short ones.","see":["rest","beam","dotted-note","time-signature"]},{"id":"rest","term":"Rest","short":"A written silence. Every note value has a rest of the same length.","more":"Rests are part of the rhythm — count through them rather than skipping them.","see":["note-values"],"nolink":true},{"id":"beam","term":"Beam","short":"The thick line that joins eighth or sixteenth notes into beat-sized groups so the eye can count them.","more":"","see":["note-values"],"nolink":true},{"id":"dotted-note","term":"Dotted note","short":"A dot after a note adds half its own length: a dotted half is 3 beats, a dotted quarter 1½.","more":"","see":["note-values","tie"]},{"id":"tie","term":"Tie","short":"A curve joining two notes of the same pitch: play the first and hold through both lengths.","more":"It is how a long note crosses a bar line. A curve joining different pitches is a slur — play them smoothly.","see":["note-values","dotted-note","bar"],"nolink":true},{"id":"triplet","term":"Triplet","short":"Three notes squeezed into the time of two, marked with a 3.","more":"Eighth-note triplets split each beat into three — the feel under a shuffle or a 12/8 blues.","see":["note-values","shuffle","compound-time"]},{"id":"compound-time","term":"Compound time","short":"A meter whose beats split into three, like 6/8 (two beats of three eighths) or 12/8.","more":"Simple time (2/4, 3/4, 4/4) splits each beat in two. 6/8 lilts; 3/4 waltzes — both have six eighths, grouped differently.","see":["time-signature","beat","triplet"]},{"id":"clef","term":"Treble clef","short":"The curly sign at the start of the staff that fixes which line is which note; its curl circles the G line.","more":"Guitar music is written in treble clef and sounds an octave lower than written.","see":["staff","ledger-line"]},{"id":"ledger-line","term":"Ledger line","short":"A short extra line above or below the staff for notes that run off it. The guitar’s low E hangs below three ledger lines.","more":"","see":["staff","clef"]},{"id":"dynamics","term":"Dynamics","short":"How loud or soft to play: p (piano) soft, f (forte) loud, with mp and mf between.","more":"Hairpins widening (crescendo) mean get louder; narrowing (decrescendo) means get softer.","see":["accent","staff"]},{"id":"accent","term":"Accent (>)","short":"Play that note or strum harder than its neighbours.","more":"Accents on beats 2 and 4 give a backbeat; accents off the beat give syncopation.","see":["dynamics","syncopation","backbeat"],"nolink":true},{"id":"repeat-sign","term":"Repeat sign","short":"Two dots beside a double bar line: go back to the matching sign (or the start) and play the passage again.","more":"","see":["bar","staff"]},{"id":"staccato","term":"Staccato","short":"A dot above or below a note: play it short and detached.","more":"On guitar, release the fretting pressure right after the note sounds.","see":["note-values","accent"]},{"id":"diatonic","term":"Diatonic","short":"Belonging to the key — using only its seven scale notes. \"Diatonic chords\" are the seven built from those notes.","more":"","see":["chromatic","key","roman-numerals"]},{"id":"scale-degree","term":"Scale degree","short":"A note’s number in its scale, counted up from the home note: 1, 2, 3 … 7.","more":"The degrees have names: tonic, supertonic, mediant, subdominant, dominant, submediant, leading tone. Chords take their Roman numerals from them.","see":["tonic","dominant","subdominant","leading-tone","roman-numerals"]},{"id":"supertonic","term":"Supertonic","short":"Scale degree 2 — the step just above the tonic. Its chord is ii.","more":"","see":["scale-degree","tonic"]},{"id":"mediant","term":"Mediant","short":"Scale degree 3, halfway from the tonic to the dominant. It decides major or minor.","more":"","see":["scale-degree","third"]},{"id":"subdominant","term":"Subdominant","short":"Scale degree 4 — a fifth below the tonic, as the dominant is a fifth above. Its chord is IV.","more":"","see":["scale-degree","dominant","plagal-cadence"]},{"id":"dominant","term":"Dominant","short":"Scale degree 5, the second most important note in a key. The chord built on it, V, pulls hardest back home.","more":"","see":["scale-degree","tonic","authentic-cadence","dominant-seventh"]},{"id":"submediant","term":"Submediant","short":"Scale degree 6 — the root of the vi chord and of the relative minor.","more":"","see":["scale-degree","relative-minor"]},{"id":"leading-tone","term":"Leading tone","short":"Scale degree 7, a half step below the tonic. It leans so hard upward that it powers the V → I ending.","more":"Natural minor has a ♭7 a whole step below home — no leading tone — which is why harmonic minor raises it.","see":["scale-degree","dominant","harmonic-minor"]},{"id":"parallel-key","term":"Parallel keys","short":"A major and a minor key with the same tonic, like C major and C minor.","more":"Relative keys share notes (C major / A minor); parallel keys share a home. Borrowed chords come from the parallel key.","see":["relative-minor","borrowed-chord","key"]},{"id":"natural-minor","term":"Natural minor","short":"The minor scale with ♭3, ♭6 and ♭7 — the major scale started on its 6th note. Also called Aeolian.","more":"","see":["minor-scale","harmonic-minor","melodic-minor","relative-minor"]},{"id":"harmonic-minor","term":"Harmonic minor","short":"Natural minor with the 7th raised a half step, so the V chord turns major and pulls home.","more":"The raised 7th leaves a step-and-a-half gap after the ♭6 — the scale’s exotic, dramatic sound. A harmonic minor uses G♯.","see":["natural-minor","leading-tone","melodic-minor"]},{"id":"melodic-minor","term":"Melodic minor","short":"Minor with the 6th and 7th raised on the way up; classically it falls back to natural minor on the way down.","more":"Jazz players keep it raised in both directions.","see":["natural-minor","harmonic-minor"]},{"id":"blues-scale","term":"Blues scale","short":"The minor pentatonic plus one extra note, the ♭5: 1 ♭3 4 ♭5 5 ♭7.","more":"","see":["pentatonic","blue-note","twelve-bar-blues"]},{"id":"blue-note","term":"Blue note","short":"The ♭5 added to the minor pentatonic — a gritty passing note between the 4 and the 5. Bending the ♭3 toward the 3 is the other classic blue note.","more":"","see":["blues-scale","bend"]},{"id":"scale-position","term":"Scale position (box)","short":"One hand-sized patch of a scale on the neck, about four or five frets wide. Five positions join up to cover the whole fretboard.","more":"","see":["scale-diagram","pentatonic","caged"]},{"id":"ionian","term":"Ionian","short":"The first mode — the ordinary major scale.","more":"","see":["mode","major-scale"]},{"id":"dorian","term":"Dorian","short":"Mode 2: natural minor with a raised 6th. Cool and soulful — funk, jazz and Santana.","more":"","see":["mode","natural-minor"]},{"id":"phrygian","term":"Phrygian","short":"Mode 3: natural minor with a ♭2. Dark and Spanish-sounding — flamenco and metal.","more":"","see":["mode","natural-minor"]},{"id":"lydian","term":"Lydian","short":"Mode 4: major with a raised 4th. Dreamy and floating — film scores.","more":"","see":["mode","major-scale"]},{"id":"mixolydian","term":"Mixolydian","short":"Mode 5: major with a ♭7. Bright but bluesy — classic rock, country, Celtic.","more":"It is the scale of the dominant 7 chord.","see":["mode","major-scale","dominant-seventh"]},{"id":"aeolian","term":"Aeolian","short":"Mode 6 — the natural minor scale.","more":"","see":["mode","natural-minor"]},{"id":"locrian","term":"Locrian","short":"Mode 7: built on the diminished vii° chord, with a ♭2 and ♭5. Unstable and rarely used as a home.","more":"","see":["mode","diminished"]},{"id":"transpose","term":"Transpose","short":"Move a piece to a new key, keeping every interval the same.","more":"Roman numerals make it easy: I–IV–V in G is G–C–D; in A it is A–D–E. A capo transposes without new shapes.","see":["key","roman-numerals","capo"]},{"id":"perfect-interval","term":"Perfect intervals","short":"The unison, 4th, 5th and octave. They have no major or minor version.","more":"One half step smaller is diminished; one larger is augmented.","see":["interval","interval-quality","fifth"]},{"id":"interval-quality","term":"Interval quality","short":"The first word of an interval’s name: perfect, major, minor, augmented or diminished.","more":"Count letter names for the number (C to E is a 3rd), then half steps for the quality (4 = major 3rd, 3 = minor 3rd).","see":["interval","perfect-interval","inversion"]},{"id":"augmented","term":"Augmented","short":"One half step larger than major or perfect. An augmented triad stacks two major thirds — marked +.","more":"The augmented 4th is the tritone.","see":["interval-quality","diminished","tritone"]},{"id":"inversion","term":"Inversion","short":"Turning something upside down. An interval inverts by moving the lower note up an octave; a chord inverts by putting a note other than the root in the bass.","more":"Interval inversions add up to 9 (a 3rd becomes a 6th) and swap major ↔ minor. A chord with its 3rd in the bass, like G/B, is in first inversion.","see":["interval","slash-chord","interval-quality"]},{"id":"consonance","term":"Consonance and dissonance","short":"Consonant intervals (octaves, fifths, thirds, sixths) sound settled; dissonant ones (seconds, sevenths, the tritone) sound tense.","more":"Music moves between the two — tension, then release.","see":["interval","resolution","tritone"]},{"id":"chord-quality","term":"Chord quality","short":"A chord’s type: major, minor, diminished, augmented, or a seventh, sus or added-note colour.","more":"The third sets major or minor; the fifth sets diminished or augmented; extra notes add colour.","see":["triad","major-chord","minor-chord","seventh-chord"]},{"id":"dominant-seventh","term":"Dominant 7 chord","short":"A major triad plus a ♭7, written like G7. The V7 of a key — restless, bluesy, it wants to resolve.","more":"Its 3rd and ♭7 form a tritone that collapses into the I chord.","see":["seventh-chord","dominant","tritone","mixolydian"]},{"id":"major-seventh","term":"Major 7 chord","short":"A major triad plus a natural 7th, written Cmaj7. Soft, dreamy and settled.","more":"","see":["seventh-chord","dominant-seventh"]},{"id":"minor-seventh","term":"Minor 7 chord","short":"A minor triad plus a ♭7, written Am7. The mellow, rounded version of a minor chord.","more":"","see":["seventh-chord","minor-chord"]},{"id":"half-diminished","term":"Half-diminished (ø)","short":"A diminished triad plus a ♭7, also written m7♭5. It is the vii chord of a major key and the ii of a minor key.","more":"","see":["diminished","seventh-chord"]},{"id":"sus-chord","term":"Sus chord","short":"A chord with its 3rd swapped for the 2nd (sus2) or the 4th (sus4). Neither major nor minor — open and waiting.","more":"A sus4 often resolves back to the plain chord: Dsus4 → D.","see":["chord-quality","third","add9"]},{"id":"add9","term":"Add9 and 9 chords","short":"Add9 puts the 9th (the 2nd, an octave up) on top of a triad and keeps the 3rd. A 9 chord also has the ♭7.","more":"","see":["chord-quality","sus-chord","seventh-chord"]},{"id":"sixth-chord","term":"Sixth chord","short":"A triad plus the 6th, written C6 or Am6. Sweet and vintage — swing and country endings.","more":"","see":["chord-quality","triad"]},{"id":"slash-chord","term":"Slash chord","short":"A chord with a chosen bass note, written chord/bass: G/B is a G chord with B in the bass.","more":"Slash chords make bass lines walk smoothly between chords, like G → G/B → C.","see":["inversion","bass-line","root"]},{"id":"caged","term":"CAGED system","short":"The five open shapes C, A, G, E and D, moved up the neck as barre chords. Together they tile the fretboard for any chord.","more":"The E, A and D barre shapes in this book are three of them; each has a matching scale position.","see":["barre","scale-position","chord-box"]},{"id":"voicing","term":"Voicing","short":"Which notes of a chord you play, and in what order from low to high. One chord has many voicings across the neck.","more":"","see":["chord","inversion","caged"]},{"id":"cadence","term":"Cadence","short":"The chord move that ends a phrase — music’s punctuation.","more":"Authentic (V → I) is a full stop, half (ending on V) a comma or question, plagal (IV → I) an \"Amen\", deceptive (V → vi) a surprise.","see":["authentic-cadence","half-cadence","plagal-cadence","deceptive-cadence"]},{"id":"authentic-cadence","term":"Authentic cadence","short":"V → I: the strongest, most final ending in a key. Also called a perfect cadence.","more":"","see":["cadence","dominant","leading-tone"]},{"id":"plagal-cadence","term":"Plagal cadence","short":"IV → I: the gentle \"A-men\" at the end of a hymn.","more":"","see":["cadence","subdominant"]},{"id":"half-cadence","term":"Half cadence","short":"A phrase that stops on V — open-ended, asking for the next phrase to answer.","more":"","see":["cadence","dominant"]},{"id":"deceptive-cadence","term":"Deceptive cadence","short":"V → vi: the ear expects home and gets the relative minor instead, so the music keeps going.","more":"","see":["cadence","relative-minor"]},{"id":"resolution","term":"Tension and resolution","short":"Tense sounds (the V chord, a dissonance, the leading tone) pulling toward settled ones (the I chord, a consonance).","more":"Nearly every phrase you know is built on that pull.","see":["consonance","cadence","leading-tone"]},{"id":"turnaround","term":"Turnaround","short":"A short chord move at the end of a progression (often V, or ii–V) that leads back to the I chord to go round again.","more":"","see":["progression","twelve-bar-blues"]},{"id":"twelve-bar-blues","term":"12-bar blues","short":"The blues form: twelve bars of I, IV and V in a set order — I I I I · IV IV I I · V IV I V.","more":"The last bar is the turnaround back to the top.","see":["progression","blues-scale","turnaround","shuffle"]},{"id":"borrowed-chord","term":"Borrowed chord","short":"A chord taken from the parallel key, like ♭VII or iv in a major key. Colour without leaving home.","more":"","see":["parallel-key","diatonic","progression"]},{"id":"bass-line","term":"Bass line","short":"The lowest notes, usually the chord roots, moving underneath. A walking bass line steps between chords.","more":"","see":["root","slash-chord","alternating-bass"]},{"id":"strumming","term":"Strumming","short":"Brushing the pick or fingers across several strings in time — downstrokes on the beat, upstrokes on the \"&\".","more":"Keep the hand moving down and up all the time, and miss the strings for the strums you skip. That steady swing is what keeps the rhythm even.","see":["strum-pattern","beat","chuck"]},{"id":"strum-pattern","term":"Strum pattern","short":"A bar of downs (D) and ups (U) with gaps, counted 1 & 2 & 3 & 4 &.","more":"D – D U – U D U, \"the one everyone learns\", fits thousands of songs.","see":["strumming","beat","syncopation"]},{"id":"pick","term":"Pick (plectrum)","short":"The small flat piece you strum and pick with. Hold it between the thumb and the side of the index finger, a little of the tip showing.","more":"","see":["strumming","alternate-picking"],"nolink":true},{"id":"alternate-picking","term":"Alternate picking","short":"Strict down-up-down-up picking, one stroke per note. The engine of fast, even single-note lines.","more":"","see":["pick","string-skipping"]},{"id":"string-skipping","term":"String skipping","short":"Jumping over a string between two notes. It trains the picking hand to land exactly without looking.","more":"","see":["alternate-picking"]},{"id":"palm-muting","term":"Palm muting (PM)","short":"Resting the edge of the picking hand lightly on the strings by the bridge, for a short, chunky \"chug\".","more":"Too far forward and the notes go dead; right at the bridge they keep their pitch.","see":["muted-note","chuck","guitar-bridge"]},{"id":"chuck","term":"Chuck","short":"A strum on strings muted by the fretting hand — a percussive click in place of a chord, often on beats 2 and 4.","more":"The heart of funk and the \"bass, chuck\" country feel.","see":["muted-note","strumming","backbeat"]},{"id":"boom-chick","term":"Boom-chick","short":"Bass note on the beat (\"boom\"), strum on the offbeat (\"chick\"). The backbone of country and folk.","more":"","see":["bass-line","alternating-bass","strumming"]},{"id":"fingerstyle","term":"Fingerstyle","short":"Playing with the bare fingers instead of a pick: the thumb takes the bass strings, the fingers the treble.","more":"","see":["pima","arpeggio","travis-picking"]},{"id":"pima","term":"p i m a","short":"The picking-hand finger names: p thumb, i index, m middle, a ring (from the Spanish). The pinky is rarely used.","more":"Usually p takes strings 6–4, i the G, m the B, a the high E.","see":["fingerstyle","finger-numbers"]},{"id":"alternating-bass","term":"Alternating bass","short":"The thumb rocking between two bass notes, usually the root and another chord note, steady on every beat.","more":"","see":["travis-picking","boom-chick","bass-line"]},{"id":"travis-picking","term":"Travis picking","short":"An alternating thumb bass with the fingers picking melody between and on top of it. Named after Merle Travis.","more":"Learn the thumb alone until it runs on autopilot, then add one finger at a time.","see":["alternating-bass","fingerstyle","pinch"]},{"id":"pinch","term":"Pinch","short":"The thumb and a finger plucking at the same moment — a bass note and a melody note struck together.","more":"","see":["travis-picking","fingerstyle"]},{"id":"rasgueado","term":"Rasgueado","short":"The flamenco strum: the fingers flick out one after another across the strings for a rolling burst.","more":"Golpe is the tap on the guitar top that punctuates it.","see":["fingerstyle","strumming","phrygian"]},{"id":"hammer-on","term":"Hammer-on (h)","short":"Sounding a note by bringing a finger down hard onto the string, without picking it again.","more":"","see":["pull-off","legato"]},{"id":"pull-off","term":"Pull-off (p)","short":"Sounding a lower note by flicking the fretting finger off the string, so a finger already behind it rings out.","more":"","see":["hammer-on","legato"]},{"id":"legato","term":"Legato","short":"Smooth and connected: in guitar terms, notes sounded with hammer-ons, pull-offs and slides rather than a new pick stroke each.","more":"","see":["hammer-on","pull-off","slide"]},{"id":"slide","term":"Slide (/ \\)","short":"Moving a fretted note along the string to a new fret while it rings. / slides up, \\ slides down.","more":"","see":["legato","bend"],"nolink":true},{"id":"bend","term":"Bend (b)","short":"Pushing the string sideways to raise its pitch, usually a half step (½) or a whole step (full).","more":"Bend to a pitch you have heard: play the target note first, then bend until you match it.","see":["vibrato","blue-note","slide"],"nolink":true},{"id":"vibrato","term":"Vibrato (~)","short":"A gentle, even wobble in pitch on a held note — tiny repeated bends. It makes a note sing.","more":"","see":["bend"]},{"id":"riff","term":"Riff","short":"A short, repeated musical phrase that a song is built around — often on the low strings.","more":"","see":["lick","power-chord"]},{"id":"lick","term":"Lick","short":"A short melodic phrase, usually from a scale, used in solos and fills.","more":"","see":["riff","pentatonic","solo"],"nolink":true},{"id":"backbeat","term":"Backbeat","short":"The accent on beats 2 and 4 — the snare drum in rock and pop, the chuck in funk and country.","more":"","see":["beat","accent","chuck"]},{"id":"offbeat","term":"Offbeat","short":"The \"&\" between the beats. Reggae puts its chord stab (the skank) here.","more":"","see":["beat","syncopation"]},{"id":"syncopation","term":"Syncopation","short":"Accenting the offbeats or the gaps where the ear expects a beat — the \"push\" that makes a rhythm groove.","more":"A push lands a chord change one eighth early, on the & before the beat.","see":["offbeat","accent","strum-pattern"]},{"id":"shuffle","term":"Shuffle (swing feel)","short":"Long-short eighth notes: each beat split into a triplet, playing the first and third parts. The blues and swing feel.","more":"","see":["triplet","twelve-bar-blues","compound-time"],"nolink":true},{"id":"groove","term":"Groove","short":"The feel of a rhythm when the parts lock together — tempo, accents and what you leave out.","more":"","see":["backbeat","syncopation","tempo"]},{"id":"song-form","term":"Song form","short":"The order of a song’s sections, written with letters (AABA) or names (verse, chorus, bridge).","more":"Verse – chorus is the modern default; AABA is the 32-bar standard; strophic just repeats one verse.","see":["verse","chorus","song-bridge"]},{"id":"verse","term":"Verse","short":"The section that tells the story; its music repeats while the words change.","more":"","see":["song-form","chorus","pre-chorus"],"nolink":true},{"id":"chorus","term":"Chorus","short":"The section that comes back with the same words and the song’s main hook — usually the high point.","more":"A refrain is a shorter version: one repeated line that ends each verse.","see":["song-form","verse","hook"],"nolink":true},{"id":"pre-chorus","term":"Pre-chorus","short":"A short section between verse and chorus that builds tension into the chorus.","more":"","see":["verse","chorus"]},{"id":"song-bridge","term":"Bridge (of a song)","short":"A contrasting section, usually heard once late in the song, before a last chorus.","more":"It often moves to new chords — commonly starting on IV or vi — so the return home feels fresh.","see":["song-form","chorus"],"nolink":true},{"id":"hook","term":"Hook","short":"The catchy bit you remember — a line, a riff or a rhythm. Choruses are built around one.","more":"","see":["chorus","riff"],"nolink":true},{"id":"intro-outro","term":"Intro and outro","short":"The opening and closing sections. Often the chorus chords or the main riff, without the vocal.","more":"","see":["song-form","riff"]},{"id":"solo","term":"Solo","short":"A section where one instrument leads the melody, often over the verse or chorus chords.","more":"Head – solos – head is the jazz form: the tune, solos over its chords, the tune again.","see":["song-form","lick","pentatonic"],"nolink":true}]};

function slide(c, d) {   // move a closed shape up d frets; names re-spelled, and the notes re-checked against the original quality

// Build a chapter quiz: mostly the chapter's topic, with a few review questions woven in from the previous chapter.
function buildQuiz(primary, review, n) {
  const out = [], seen = new Set(); let g = 0;
  while (out.length < n && g++ < 1500) {
    const useReview = review.length && out.length >= 3 && Math.random() < 0.2;
    const pool = useReview ? review : primary, tp = pool[rnd(pool.length)], facs = QBANK[tp];
    if (!facs || !facs.length) continue;
    const Q = facs[rnd(facs.length)]();
    if (!Q || seen.has(Q.q)) continue; seen.add(Q.q); if (useReview) Q.review = true; out.push(Q);
  }
  return shuffle(out);
}

  setTimeout(() => { const pg = $('#page'); if (pg && wizHolder) { const r = wizHolder.getBoundingClientRect(), pr = pg.getBoundingClientRect(); pg.scrollTop += (r.top - pr.top) - pr.height * 0.4; } }, 60);
}

// the Learn page: the course road (with the Index still reachable until it moves to the cover)
PAGES.push({id: 'learn', no: 'I', name: 'Learn', blurb: 'a path from first chord to fluent', acc: 'var(--navy)', draw(v) {
  pageScroll = false;
  v.append(header('I', 'Learn', '', 'climb the path · clear a chapter to open the next', 'var(--navy)'));
  v.append(h('div', {class: 'toolbar'},
    h('label', {class: 'pick'}, h('span', {}, 'Sound'), h('button', {class: 'btn' + (soundOn() ? ' acc' : ''), style: 'min-height:40px', on: {click: () => { store.set('course.sound', !soundOn()); redraw(); }}}, soundOn() ? 'On' : 'Off'))));
  const s = state('course', {open: -1});
  if (s.open >= 0 && s.open < LESSONS.length) quizView(v, LESSONS[s.open], s.open);
  else roadView(v);
}});

/* ================================================================ SKETCHPAD (the songwriting studio, at the back of the book) */
PAGES.push({id: 'sketch', no: 'VI', name: 'Song Sketchpad', blurb: 'write your own · saves as you go', acc: 'var(--rust)', draw(v) {
  v.append(header('VI', 'Song <em>Sketchpad</em>', `build a song from the ${tm('chord', 'chords')} of any ${tm('key')} · it saves on this iPad as you go`, `tap a bar, then a chord · Roll for a fresh ${tm('progression')}`, 'var(--rust)'));
  const holder = h('div', {style: 'display:flex;flex-direction:column;gap:14px'}); v.append(holder);
  const real = $('#topright'); VIEWS.write(holder);
}});

/* ================================================================ THE INDEX (page VII: the whole book's glossary, organized by topic) */
// Concepts grouped for browsing. A term missing from every group still appears in Everything A–Z,
// so a new concept can never silently vanish from the Index.
const IDX_GROUPS = [
  ['guitar', 'The Guitar & Tuning', ['headstock', 'nut', 'fretboard', 'fret', 'position-markers', 'guitar-body', 'guitar-bridge', 'soundhole', 'pickup', 'string-numbers', 'open-string', 'standard-tuning', 'relative-tuning', 'alternate-tuning', 'drop-d', 'open-tuning', 'capo']],
  ['neck', 'Notes & the Neck', ['musical-alphabet', 'note', 'natural', 'sharp', 'flat', 'accidental', 'double-sharp', 'enharmonic', 'semitone', 'half-step', 'whole-step', 'chromatic', 'unison', 'octave', 'octave-shape']],
  ['pictures', 'Reading the Pictures', ['chord-box', 'finger-numbers', 'scale-diagram', 'tab', 'muted-note']],
  ['reading', 'Rhythm & Notation', ['staff', 'clef', 'ledger-line', 'beat', 'bar', 'time-signature', 'compound-time', 'tempo', 'note-values', 'rest', 'beam', 'dotted-note', 'tie', 'triplet', 'repeat-sign', 'dynamics', 'accent', 'staccato', 'key-signature']],
  ['scaleskeys', 'Scales & Keys', ['scale', 'major-scale', 'minor-scale', 'natural-minor', 'harmonic-minor', 'melodic-minor', 'pentatonic', 'blues-scale', 'blue-note', 'scale-position', 'key', 'tonic', 'diatonic', 'relative-minor', 'parallel-key', 'circle-of-fifths', 'transpose']],
  ['degrees', 'Scale Degrees', ['scale-degree', 'tonic', 'supertonic', 'mediant', 'subdominant', 'dominant', 'submediant', 'leading-tone']],
  ['modes', 'The Modes', ['mode', 'ionian', 'dorian', 'phrygian', 'lydian', 'mixolydian', 'aeolian', 'locrian']],
  ['intervals', 'Intervals', ['interval', 'unison', 'third', 'fifth', 'tritone', 'perfect-interval', 'interval-quality', 'augmented', 'inversion', 'consonance']],
  ['chordsharm', 'Chords', ['chord', 'triad', 'root', 'chord-quality', 'major-chord', 'minor-chord', 'diminished', 'augmented', 'seventh-chord', 'dominant-seventh', 'major-seventh', 'minor-seventh', 'half-diminished', 'sus-chord', 'add9', 'sixth-chord', 'power-chord', 'slash-chord', 'inversion', 'voicing', 'barre', 'caged']],
  ['harmony', 'Harmony & Progressions', ['roman-numerals', 'progression', 'cadence', 'authentic-cadence', 'plagal-cadence', 'half-cadence', 'deceptive-cadence', 'resolution', 'turnaround', 'twelve-bar-blues', 'borrowed-chord', 'bass-line']],
  ['picking', 'The Picking Hand', ['pick', 'strumming', 'strum-pattern', 'alternate-picking', 'string-skipping', 'palm-muting', 'chuck', 'boom-chick', 'fingerstyle', 'pima', 'arpeggio', 'alternating-bass', 'travis-picking', 'pinch', 'rasgueado']],
  ['lead', 'Lead & the Fretting Hand', ['hammer-on', 'pull-off', 'legato', 'slide', 'bend', 'vibrato', 'riff', 'lick', 'solo']],
  ['feel', 'Rhythm Feel', ['beat', 'backbeat', 'offbeat', 'syncopation', 'shuffle', 'groove', 'tempo']],
  ['form', 'Song Form', ['song-form', 'intro-outro', 'verse', 'pre-chorus', 'chorus', 'song-bridge', 'hook', 'solo', 'twelve-bar-blues']],
];
PAGES.push({id: 'index', no: 'VII', name: 'The Index', blurb: 'every term and idea in the book, organized', acc: 'var(--navy)', draw(v) {
  pageScroll = true;
  v.append(header('VII', 'The <em>Index</em>', 'every term the book uses and the ideas behind each lesson', 'browse by topic, or A to Z · tap anything to open it', 'var(--navy)'));
  const st = state('indexpage', {sec: 'az'});
  const go = sec => { st.sec = sec; keep('indexpage', st); redraw(); };
  const navBtn = ([sec, label]) => h('button', {class: 'btn' + (st.sec === sec ? ' acc' : ''), style: 'justify-content:flex-start;text-align:left;min-height:42px', on: {click: () => go(sec)}}, label);
  const nav = h('div', {style: 'display:flex;flex-direction:column;gap:6px'},
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin-bottom:2px'}, 'THE TERMS'),
    navBtn(['az', 'Everything A–Z']), ...IDX_GROUPS.map(g => navBtn([g[0], g[1]])),
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin:10px 0 2px'}, 'THE IDEAS'),
    ...INDEX_SUBS.filter(s => s[0] !== 'glossary').map(([k, nm]) => navBtn(['facts:' + k, nm])));
  const body = h('div', {style: 'display:flex;flex-direction:column;gap:12px;min-width:0'});
  const row = c => h('button', {class: 'gloss-row', 'data-c': c.id}, h('b', {}, c.term), h('span', {}, c.short));
  if (st.sec.startsWith('facts:')) {
    const k = st.sec.slice(6), name = (INDEX_SUBS.find(s => s[0] === k) || [])[1], facts = (D.theory.facts || []).filter(f => f.tag === k);
    body.append(sec2(name, 'the ideas behind the lessons · tap any term to open it', 'var(--navy)',
      h('div', {class: 'facts'}, facts.map(f => h('div', {class: 'fact'}, h('h3', {}, f.t), h('p', {html: glossify(f.b)}))))));
  } else if (st.sec === 'az') {
    const cs = (D.concepts || []).slice().sort((a, b) => a.term.localeCompare(b.term));
    const list = h('div', {class: 'gloss'}); let letter = '';
    cs.forEach(c => { const l = c.term[0].toUpperCase();
      if (l !== letter) { letter = l; list.append(h('div', {style: 'grid-column:1/-1;font-weight:900;color:var(--navy);margin:8px 0 0;letter-spacing:.1em'}, l)); }
      list.append(row(c)); });
    body.append(sec2('Everything A–Z', 'every term in the book · tap one to open it, then follow “see also”', 'var(--navy)', list));
  } else {
    const g = IDX_GROUPS.find(x => x[0] === st.sec) || IDX_GROUPS[0], byId = {}; (D.concepts || []).forEach(c => byId[c.id] = c);
    body.append(sec2(g[1], 'tap a term to open it · related terms link onward', 'var(--navy)',
      h('div', {class: 'gloss'}, g[2].filter(id => byId[id]).map(id => row(byId[id])))));
  }
  v.append(h('div', {class: 'body', style: 'grid-template-columns:minmax(185px,.3fr) minmax(0,1fr);align-items:start'}, nav, body));
}});

// the book's reading order: the course up front, then the reference pages, then the tools
const PAGE_ORDER = ['cover', 'learn', 'chords', 'scales', 'righthand', 'writing', 'sketch', 'index'];
PAGES.sort((a, b) => PAGE_ORDER.indexOf(a.id) - PAGE_ORDER.indexOf(b.id));
PAGES.forEach(p => p.blurb = p.blurb || '');
const start = (location.hash || '').slice(1), si = PAGES.findIndex(p => p.id === start);
page(si >= 0 ? si : store.get('at', 0));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<div id="topright" hidden></div>
</body></html>
